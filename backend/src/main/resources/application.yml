spring:
  application:
    name: acjb-server

  # 로컬 개발 편의: backend/.env 에 KEY=VALUE 형식으로 넣어두면 자동으로 읽힘 (커밋 금지, .gitignore 처리됨)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qating}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:qating}
    password: ${DB_PASSWORD}

  # 테이블은 Flyway가 db/migration/V*.sql을 순서대로 적용해 만든다(2026-11-05). 스키마를 바꾸려면 새 V 파일을 추가한다
  flyway:
    locations: classpath:db/migration

  # 수동 QA 이미지 첨부는 5MB까지(SPEC AC30) — 요청 전체는 여유를 조금 둔다
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    # Hibernate는 테이블을 고치지 않고 엔티티와 맞는지 검사만 한다 — 어긋나면 서버가 뜨지 않는다
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # 이슈 목록에서 repro_steps·screenshots·style_mismatch를 이슈마다 따로 읽는 N+1을 묶음 조회로 줄인다
      hibernate.default_batch_fetch_size: 100

  # 초대 메일 SMTP(Gmail) — 계정·앱 비밀번호는 backend/.env의 MAIL_USERNAME·MAIL_PASSWORD
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 기본값(/login/oauth2/code/google) 대신 SecurityConfig의 콜백 경로와 맞춤.
            # ⚠️ Google Cloud Console의 "승인된 리디렉션 URI"도 아래 경로로 갱신해야 함:
            #    http://localhost:8080/api/v1/auth/callback/google
            redirect-uri: "{baseUrl}/api/v1/auth/callback/{registrationId}"
            scope:
              - email
              - profile

server:
  port: 8080
  # 배포(2026-11-10): Caddy가 HTTPS를 끝내고 넘긴다 — X-Forwarded-* 를 믿어야 OAuth 콜백 주소({baseUrl})가 https 도메인이 된다
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 배포에서는 true(HTTPS만). 로컬 http 개발은 false
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  # parse(AC8) — 모델은 parse_query.md 실패 모드 점검표를 검증한 모델과 맞춘다(2026-11-04 설만수 결정)
  # 초대 메일(AC17) — 팀 공용 Gmail 계정. 수락 링크는 프론트의 초대 페이지({token}에 원문 토큰)
  invite:
    mail-from: ${MAIL_USERNAME:}
    accept-url: ${APP_BASE_URL:http://localhost:5173}/invitations/{token}
  # Figma 동기화 — 토큰은 backend/.env의 FIGMA_ACCESS_TOKEN(로그에 남기지 않는다)
  figma:
    access-token: ${FIGMA_ACCESS_TOKEN:}
    base-url: https://api.figma.com
    timeout: 30s
  # GitHub 저장소 연결(AC21) — 공개 저장소만. 토큰은 선택(backend/.env의 GITHUB_TOKEN, 없으면 익명 — 호출 한도가 낮다)
  github:
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
    timeout: 15s
  # 단일 컴포넌트 scan — 서버가 target_url을 헤드리스 크로미움으로 연다. 루프백(localhost)은 로컬 개발에서만 허용
  # (backend/.env의 SCAN_ALLOW_LOCALHOST=true). 사설 IP·메타데이터 주소는 항상 막는다(2026-11-04 설만수 결정)
  scan:
    allow-localhost: ${SCAN_ALLOW_LOCALHOST:false}
    timeout: 30s
  # 실시간 QA 워크스페이스(SPEC AC29~AC31) — 배포 화면 캡처는 scan과 같은 주소 제한(app.scan.allow-localhost)을 쓴다
  capture:
    timeout: 30s
    embed-check-timeout: 8s
  parse:
    model: claude-sonnet-5
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: 30s
  # 재검증 범위 제안(AC20) — LLM은 parse와 같은 키·모델, 임베딩은 Voyage AI(backend/.env의 VOYAGE_API_KEY, 2026-11-05 결정)
  recheck:
    model: claude-sonnet-5
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: 60s
  # 비교 분석(AC22) — Figma 프레임·노드 ↔ 코드 매핑. Sonnet + 코드 부분 프롬프트 캐시(2026-11-07 결정, 정확도는 Opus로 잰 스파이크 기준 — 크레딧 충전 뒤 Sonnet으로 다시 잰다)
  analysis:
    model: claude-sonnet-5-5
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: 10m
    # 노드 단계를 동시에 부르는 수와 넘길 코드 총량(넘으면 잘라 넣지 않고 실패한다)
    node-concurrency: 4
    max-code-chars: 1000000
  # 첫 QA·Re-QA 비교기 — true면 개발용 가짜 비교기(시연용 값). 운영에서 켜지 않는다(SPEC 4절·N17, 2026-11-08)
  # 실제 비교기(2026-11-10 스파이크) — 비교 분석과 같은 모델. 노드마다 1번 호출, 동시에 부르는 수
  qa:
    fake-comparator: ${QA_FAKE_COMPARATOR:false}
    model: claude-sonnet-5-5
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: 10m
    concurrency: 4
  voyage:
    api-key: ${VOYAGE_API_KEY:}
    base-url: https://api.voyageai.com
    model: voyage-4
    dimension: 1024
    timeout: 30s
  # 프론트(client) 로컬 개발 origin — frontend/ 스캐폴딩 완료로 확정 (Vite 기본 포트 5173)
  cors:
    # 쉼표로 여러 개. 배포에서는 프론트와 API가 같은 도메인이라 그 주소 하나
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  oauth2:
    # 구글 로그인 성공 후 리다이렉트할 프론트 주소. 쿠키는 host 기준(포트 무관)이라
    # localhost:8080에서 만든 세션 쿠키가 localhost:5173 요청에도 그대로 붙음.
    # 배포에서는 APP_BASE_URL(예: https://qating.example.com)
    login-success-redirect: ${APP_BASE_URL:http://localhost:5173}/
    # 로그아웃 후 돌아갈 프론트 주소(로그인 화면). openapi의 "'/'로 리다이렉트"는 프론트의 '/'다
    logout-success-redirect: ${APP_BASE_URL:http://localhost:5173}/
