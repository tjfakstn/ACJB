# QAting 미니 도메인 온톨로지 (강의 2 산출물)
# 작성: AI가 후보를 뽑고, 대표어·경계·범위 밖·evidence는 사람이 로그 원문과 대조해 승인했다.
# 검토: 오단비 / 2026-09-28
# evidence: 는 docs/research/interviews.md B절 로그 번호(1~12)와 C절 관찰 번호. 역추적되지 않는 항목은 두지 않는다.
# 규칙: relations의 대상은 반드시 이 파일에 정의된 클래스여야 한다(미정의 클래스 참조 금지).
#
# 어휘 추출 (로그에서 반복된 말 → 대표어)
#   명사: 이슈 = 티켓 = QA 리스트 항목 = 버그 리포트 → QAIssue
#         배포 화면 = 실제 화면 = 구현 화면 → Screen
#         Figma 시안 = 피그마 화면 = 프레임 → FigmaFrame
#         색상 코드·굵기·radius 차이 = 토큰 값 차이(Gray 80 vs 90) → StyleMismatch
#         기기 = OS = 브라우저 = 배포 환경 → Environment
#         재확인 = 재검수 → Verification / 노티 = 알림 → Notification
#         개발자·디자이너·기획자 = 보고자·담당자 → Member
#   동사: 대조한다, 등록한다, 알린다, 수정한다, 재확인한다

version: 1
classes:
  QAIssue:
    description: QA 중 발견되어 등록·전달되는 수정 요청 한 건
    evidence: [로그 1, 로그 2, 로그 8, 로그 11, 로그 12, 관찰 1]
    attributes:
      description: {type: string, note: "자유서술. 텍스트만으로는 재현이 안 되는 경우가 많다", evidence: [로그 1, 로그 9, 로그 11]}
      screen_location: {type: string, note: "어느 화면의 어느 요소인지", evidence: [로그 2, 로그 11]}
      repro_steps: {type: list, evidence: [로그 1, 로그 6, 로그 9]}
      screenshots: {type: list, evidence: [로그 2, 로그 10, 관찰 1]}
      figma_link: {type: string, evidence: [관찰 1]}
      fix_link: {type: string, note: "고친 PR·커밋 GitHub 주소(담당 팀이 붙임, 0..1). 커밋 메시지·PR 제목의 이슈 키 QA-{id}로도 연결된다 — GitHub는 읽기만(AC34)", evidence: [decision_log 2026-11-10]}
      platform_scope: {type: enum, values: [common, aos, ios], note: "이슈 분류용(공통=AOS·iOS 모두). 실제 발생 환경은 Environment", evidence: [로그 8, 관찰 1]}
      status: {type: enum, values: [needs_check, in_progress, fixed, needs_recheck, resolved], note: "확인 필요 → (수정 중, 건너뛸 수 있음) → 조치 완료 → (재확인 pass) 해결 완료 / (fail) 재확인 필요 → 수정 중·조치 완료. fixed로 바뀔 때 Notification(event=fixed) 발생. in_progress는 2026-11-07 시안 반영(알림 없음)", evidence: [로그 8, 관찰 1, decision_log 2026-11-07]}
      source: {type: enum, values: [manual, first_qa], note: "manual=사람이 등록(파싱·스타일 차이 경유 포함), first_qa=첫 QA가 근거로 자동 저장(담당 팀 없이 시작)", evidence: [decision_log 2026-11-07]}
      status_history: {type: list, note: "상태 변경 시각·변경자", evidence: [로그 8, 관찰 1]}
      assigned_team: {type: enum, values: [planner, designer, frontend, backend], note: "담당 팀 — 그 프로젝트에서 이 역할인 멤버들. 사람(assigned_to) 대신 팀에 배정한다(시안 ASN)", evidence: [decision_log 2026-11-08]}
    relations:
      - about: Screen
        evidence: [로그 2, 로그 11, 관찰 1]
      - occurs_in: Environment
        evidence: [로그 1, 로그 8, 로그 9, 관찰 1]
      - reported_by: Member
        evidence: [로그 11, 로그 12]
      - originates_from: StyleMismatch
        evidence: [로그 8, 관찰 1]
      - checked_by: Verification
        evidence: [로그 1, 로그 2, 로그 8, 관찰 1]
      - pinned_at: ManualQaPin
        note: "실시간 QA 워크스페이스에서 배포 화면 위치를 찍어 등록한 수동 QA만(0..1)"
        evidence: [decision_log 2026-11-10]

  Screen:
    description: 배포된 앱·웹의 실제 구현 화면
    evidence: [로그 1, 로그 2, 로그 8, 관찰 1]
    attributes:
      name: {type: string, evidence: [로그 2, 관찰 1]}
      entry_condition: {type: string, note: "조건을 달성해야 보이는 화면의 진입 조건", evidence: [로그 8, 관찰 1]}
    relations:
      - implements: FigmaFrame
        evidence: [로그 1, 로그 2, 관찰 1]

  FigmaFrame:
    description: 디자인 기준이 되는 Figma 시안 화면
    evidence: [로그 1, 로그 2, 로그 3, 로그 8, 관찰 1]
    attributes:
      name: {type: string, evidence: [관찰 1]}
      frame_url: {type: string, evidence: [관찰 1]}

  StyleMismatch:
    description: Figma 기준값과 구현 값이 다른 스타일 차이 한 건
    evidence: [로그 1, 로그 2, 로그 3, 로그 8, 로그 10, 로그 11, 관찰 1]
    attributes:
      property: {type: enum, values: [color, font_weight, font_size, font_family, radius, shadow, spacing, text], evidence: [로그 3, 로그 8, 로그 9, 로그 10, 로그 11]}
      expected_value: {type: string, note: "Figma 기준값(토큰 이름 포함 가능, 예 Gray 80). actual_value와 혼동 금지", evidence: [로그 8, 로그 11, 관찰 1]}
      actual_value: {type: string, note: "구현 화면에 실제 적용된 값(개발자 모드로 확인)", evidence: [로그 8, 로그 11, 관찰 1]}
    relations:
      - compares: FigmaFrame
        evidence: [로그 2, 로그 8, 관찰 1]
      - compares: Screen
        evidence: [로그 2, 로그 8, 관찰 1]

  Environment:
    description: 이슈가 발생·확인된 기기, OS, 브라우저, 배포 단계
    evidence: [로그 1, 로그 6, 로그 8, 로그 9, 로그 11, 로그 12]
    attributes:
      platform: {type: enum, values: [aos, ios, web], evidence: [로그 1, 로그 8, 로그 11]}
      device: {type: string, note: "기종·화면 크기", evidence: [로그 1, 로그 6, 로그 12]}
      browser: {type: string, evidence: [로그 1]}
      deploy_stage: {type: enum, values: [local, staging, production], evidence: [로그 9, 로그 11]}

  Verification:
    description: 수정 후 재확인 1회
    evidence: [로그 1, 로그 2, 로그 6, 로그 8, 로그 9, 로그 12, 관찰 1]
    attributes:
      result: {type: enum, values: [pass, fail], note: "fail이면 QAIssue.status = needs_recheck", evidence: [로그 8, 관찰 1]}
      verified_at: {type: datetime, evidence: [로그 8]}
      scope: {type: string, note: "재확인 범위(해당 화면만 / 관련 화면 전체)", evidence: [로그 2, 로그 6, 로그 9, 로그 12]}
      source: {type: enum, values: [manual, re_qa], note: "manual=등록자가 재현 절차로 직접, re_qa=소유자가 실행한 자동 Re-QA(첫 QA 이슈만)", evidence: [decision_log 2026-11-08]}
      observed_value: {type: string, note: "Re-QA가 다시 읽은 구현 값(수정 후)", evidence: [decision_log 2026-11-08]}
    relations:
      - verified_by: Member
        evidence: [로그 1]

  Member:
    description: QA에 참여하는 팀원. 구글 로그인 이메일로 식별하며, 처음 로그인할 때 만들어진다
    evidence: [로그 2, 로그 3, 로그 11, 로그 12]
    attributes:
      email: {type: string, note: "구글 로그인 이메일. 초대 수락 때 초대받은 이메일과 같아야 한다", evidence: [decision_log 2026-11-04]}
    relations:
      - joins: Project
        note: "프로젝트마다 role(designer/frontend/backend/planner)이 따로 있다 — 같은 사람이 프로젝트 A에선 개발자, B에선 기획자일 수 있다. 초대받은 사람은 수락할 때 고르고 만든 사람은 미지정으로 시작한다. 이후 변경은 소유자만(2026-11-07)"
        evidence: [로그 3, 로그 11, decision_log 2026-11-04]

  # --- 실시간 QA 워크스페이스 (2026-11-10 결정으로 추가, 시안 M-01~M-10) ---
  # 인터뷰 로그의 "캡처에 위치를 표시해 전달"(로그 2, 10, 관찰 1)을 화면 위 핀으로 구조화한 것. evidence는 decision_log — 검토자 확인 필요
  ManualQaPin:
    description: 배포 화면(또는 첨부 이미지) 위에 사람이 찍은 수동 QA 위치와 그때의 캡처 한 건. QAIssue 하나에 속한다
    evidence: [로그 2, 로그 10, 관찰 1, decision_log 2026-11-10]
    attributes:
      pin_number: {type: integer, note: "프로젝트마다 1부터, 저장 성공 때 발급. 화면 표시 ID는 QA-M###", evidence: [decision_log 2026-11-10]}
      title: {type: string, note: "필수, 100자 이하", evidence: [decision_log 2026-11-10]}
      page_path: {type: string, note: "배포 주소 기준 경로(/로 시작). 교차 출처 화면은 경로를 읽을 수 없어 사람이 확인한 값", evidence: [decision_log 2026-11-10]}
      anchor: {type: object, note: "x_px·y_px(기준 viewport 안의 픽셀)과 그 비율. 스크롤 위치는 알 수 없어 저장하지 않는다", evidence: [decision_log 2026-11-10]}
      viewport: {type: object, note: "width·height — 등록할 때 보던 화면 크기", evidence: [decision_log 2026-11-10]}
      location_basis: {type: enum, values: [live_overlay, capture_image, none], note: "none=위치 없이 등록(배포 화면 없음 — 좌표·화면 크기 없음, 재현 절차는 사람이 적음, 2026-11-10). 실시간 화면 위에서 찍었는지, 첨부 이미지 위에서 찍었는지", evidence: [decision_log 2026-11-10]}
      capture_status: {type: enum, values: [captured, failed, user_attached, none], note: "서버 캡처 성공/실패, 사용자 첨부, 캡처 없음", evidence: [decision_log 2026-11-10]}
      severity: {type: enum, values: [critical, high, medium, low], note: "선택", evidence: [decision_log 2026-11-10]}
      expected_result: {type: string, note: "선택. 입력하지 않으면 비워 둔다", evidence: [decision_log 2026-11-10]}
      actual_result: {type: string, note: "선택. 입력하지 않으면 비워 둔다", evidence: [decision_log 2026-11-10]}
      figma_frame: {type: object, note: "등록 때 고른 기준 FigmaFrame(id·이름). 서버가 경로로 고르지 않는다 — 화면이 연결된 프레임을 미리 고르고 사람이 확인(AC33)", evidence: [decision_log 2026-11-10]}
    relations:
      - captured_in: QaCapture
        evidence: [decision_log 2026-11-10]
      - designed_by: FigmaFrame
        note: "0..1"
        evidence: [decision_log 2026-11-10]

  ScreenFrameLink:
    description: 이 배포 화면 경로(Screen)는 이 FigmaFrame을 보고 구현했다는 연결. Screen.implements FigmaFrame을 경로 단위로 저장한 것
    evidence: [decision_log 2026-11-10]
    attributes:
      page_path: {type: string, note: "/로 시작, :이름 조각은 어떤 한 조각과 맞는다. 한 경로에 여러 프레임(상태별 시안) 가능, 프레임 하나에 경로 하나", evidence: [decision_log 2026-11-10]}
      frame_id: {type: string, note: "최근 성공한 비교 분석 매핑에 있는 프레임만", evidence: [decision_log 2026-11-10]}
      frame_name: {type: string, note: "연결할 때의 이름", evidence: [decision_log 2026-11-10]}
    relations:
      - links: [Screen, FigmaFrame]
        note: "소유자가 지정. 코드에서 추정하지 않는다(N19)"
        evidence: [decision_log 2026-11-10]

  QaCapture:
    description: 서버 브라우저가 찍은 배포 화면 캡처 또는 사용자가 첨부한 이미지 한 장
    evidence: [로그 2, 로그 10, 관찰 1, decision_log 2026-11-10]
    attributes:
      kind: {type: enum, values: [auto, upload], note: "auto=서버가 같은 주소·viewport로 렌더링, upload=사용자 첨부(png·jpeg·webp, 5MB 이하)", evidence: [decision_log 2026-11-10]}
      page_url: {type: string, note: "auto일 때 연 주소", evidence: [decision_log 2026-11-10]}
      width: {type: integer, evidence: [decision_log 2026-11-10]}
      height: {type: integer, evidence: [decision_log 2026-11-10]}

  # --- 운영 구조 (2026-11-04 팀 결정으로 추가) ---
  # 아래 두 클래스는 인터뷰 로그가 아니라 팀 결정(사용자가 직접 프로젝트를 만들고 팀원을 초대)에서 나왔다.
  # 이 파일의 "역추적되지 않는 항목은 두지 않는다" 규칙의 예외라서 evidence를 decision_log로 둔다 — 검토자 확인 필요
  Project:
    description: 한 팀이 QA를 진행하는 단위. 이슈·알림·Figma 프레임·스타일 차이는 모두 한 프로젝트에 속한다
    evidence: [decision_log 2026-11-04]
    attributes:
      name: {type: string, evidence: [decision_log 2026-11-04]}
      description: {type: string, note: "선택, 200자 이하. 작업공간·초대 미리보기·초대 메일에 보인다", evidence: [decision_log 2026-11-07]}
      figma_connection: {type: object, note: "연결된 Figma 파일(url·file_key·이름). 서버 Figma 토큰으로 보기 권한을 확인한 뒤에만 저장", evidence: [decision_log 2026-11-07]}
      github_connection: {type: object, note: "연결된 공개 GitHub 저장소(url·owner/repo). 코드를 읽기만 한다", evidence: [decision_log 2026-11-07]}
      analysis_status: {type: enum, values: [none, queued, running, succeeded, failed], note: "비교 분석(Figma 노드 ↔ 코드 위치 매핑)의 최근 상태", evidence: [decision_log 2026-11-07]}
      first_qa_status: {type: enum, values: [none, queued, running, succeeded, failed], note: "첫 QA 실행의 최근 상태. succeeded는 프로젝트당 1번", evidence: [decision_log 2026-11-07]}
      deploy_url: {type: string, note: "실시간 QA 워크스페이스가 띄우는 배포 주소. 소유자가 입력한 값이 우선, 없으면 연결된 GitHub 저장소의 최근 성공 배포 주소를 읽는다", evidence: [decision_log 2026-11-10]}
    relations:
      - owned_by: Member
        note: "만든 사람이 소유자. 멤버 제거는 소유자만"
        evidence: [decision_log 2026-11-04]

  Invitation:
    description: 프로젝트 멤버가 다른 사람을 구글 이메일로 초대한 일 한 건. 받은 사람이 같은 구글 계정으로 수락해야 멤버가 된다
    evidence: [decision_log 2026-11-04]
    attributes:
      email: {type: string, evidence: [decision_log 2026-11-04]}
      status: {type: enum, values: [pending, accepted, canceled, expired], note: "7일 뒤 만료. 같은 이메일로 다시 초대하거나 재전송하면 새 초대 대신 그 대기 초대의 만료를 7일 연장하고 링크를 새로 발급(2026-11-07)", evidence: [decision_log 2026-11-04, decision_log 2026-11-07]}
    relations:
      - to_join: Project
        evidence: [decision_log 2026-11-04]
      - invited_by: Member
        evidence: [decision_log 2026-11-04]

  Notification:
    description: 이슈 등록·조치 사실을 상대에게 알리는 일
    evidence: [로그 2, 로그 8, 로그 11, 로그 12, 관찰 1]
    attributes:
      event: {type: enum, values: [issue_created, fixed, recheck_failed, resolved, run_failed], note: "resolved(재검증 pass → 담당 팀)·run_failed(실행 실패 → 실행한 사람)는 알림 시안 NTF 반영(2026-11-11)", evidence: [로그 2, 로그 8, 로그 11, 관찰 1, decision_log 2026-11-11]}
      cause: {type: enum, values: [registered, team_assigned], note: "issue_created의 계기 — 화면 문구만 나눈다(2026-11-11)", evidence: [decision_log 2026-11-11]}
      read_at: {type: datetime, note: "받는 사람이 읽은 시각. null이면 안읽음(2026-11-11)", evidence: [decision_log 2026-11-11]}
      channel: {type: string, examples: [email, discord, slack], evidence: [로그 8, 로그 12, 관찰 1]}
    relations:
      - about: QAIssue
        evidence: [로그 2, 로그 8]
      - about: ProjectRun
        note: run_failed만 — 이슈 대신 실패한 실행을 가리킨다(2026-11-11)
        evidence: [decision_log 2026-11-11]
      - to: Member
        evidence: [로그 11, 관찰 1]

  IssueReportContext:
    description: 자유서술 이슈 텍스트를 파싱한 구조화 결과(강의 3 구조화 출력 대상)
    evidence: [로그 1, 로그 9, 로그 11]
    attributes:
      screen: {type: string, evidence: [로그 2, 로그 11]}
      element: {type: string, evidence: [로그 11]}
      symptom: {type: string, evidence: [로그 9]}
      repro_steps: {type: list, evidence: [로그 1, 로그 6]}
      platform_scope: {type: enum, values: [common, aos, ios], evidence: [로그 8]}
    relations:
      - becomes: QAIssue
        evidence: [로그 1, 로그 11]
        
# 범위 안(QAting이 직접 생성·관리): QAIssue, StyleMismatch, Verification, Notification, IssueReportContext, Member, Project, Invitation
