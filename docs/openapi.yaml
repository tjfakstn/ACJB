openapi: 3.0.3

info:
  title: QAting API
  description: >
    QA 이슈를 재현 정보와 함께 등록하고, 조치 완료를 등록자에게 알리고, 같은 재현 절차로 재검증해 닫는
    서비스의 API 명세. v0.2 — 무엇을 만드는가의 정본은 docs/SPEC.md이며, 이 파일은 SPEC 5절을 따른다.
    DB/인증 스택이 아직 미확정이라 계속 바뀔 수 있음.
  version: 0.13.0
  contact:
    name: 안캡잘부
    url: https://github.com/tjfakstn/ACJB

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 (backend/ Spring 서버)

tags:
  - name: Auth
    description: >-
      구글 소셜로그인(OAuth2). 구현/동작 중인 태그 — 나머지 태그(Project/Notification/Figma/StyleMismatch/
      QAIssue/Verification)는 아직 설계만 된 상태
  - name: Project
    description: >-
      프로젝트 생성·멤버 조회·멤버 제거 (SPEC AC15·AC16·AC19). 로그인한 사용자 누구나 프로젝트를 만들고 만든 사람이 소유자다.
      시드 데이터로 멤버를 넣던 방식은 폐기(2026-11-04)
  - name: Invitation
    description: >-
      구글 이메일 초대와 수락 (SPEC AC17·AC18). 초대 메일의 수락 링크에 토큰이 담기고, 같은 구글 계정으로 로그인해 수락해야 멤버가 된다.
      /invitations/** 는 로그인만 필요하다(아직 그 프로젝트 멤버가 아니므로 AC12 대상 아님)
  - name: Notification
    description: 내게 온 앱 내 알림 조회 (SPEC AC14). 이메일·Slack 등 외부 채널은 v2
  - name: Figma
    description: Figma 프레임/디자인 토큰 동기화
  - name: StyleMismatch
    description: Figma 기준값과 구현 값의 스타일 차이 — 사람 입력 경로와 자동 추출·비교(scan, v1 포함·웹·color/font_weight/radius 한정) 경로
  - name: QAIssue
    description: 재현 정보가 담긴 QA 이슈 등록·상태·알림 (MVP 핵심). GitHub 연동은 v1 비포함
  - name: Verification
    description: 수정 후 재검증 — 재현 절차 재사용 (MVP 핵심)

security:
  - SessionCookie: []
    CsrfHeader: []

paths:
  /projects:
    post:
      tags: [Project]
      summary: 프로젝트 만들기 (SPEC AC16)
      description: >-
        요청자가 소유자(owner)이자 역할 미지정(role null)의 첫 멤버가 된다 — 역할은 이후 멤버 역할 변경(AC24)으로 정한다(2026-11-07).
        name 규칙(2~40자, 허용 문자)이나 description(200자 이하)을 어기면 400이고 아무것도 만들지 않는다.
        처음 로그인한 구글 계정은 이때(또는 다른 첫 요청 때) Member로 만들어진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 40, description: '공백을 뺀 길이 2~40자, 한글·영문·숫자·공백·-·_' }
                description: { type: string, maxLength: 200, description: 선택. 작업공간·초대 미리보기·초대 메일에 보인다 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Project]
      summary: 내가 속한 프로젝트 목록 (SPEC AC15)
      description: >-
        로그인한 사용자가 멤버인 프로젝트만 반환한다. 속하지 않은 프로젝트는 존재 여부도 알려 주지 않는다.
        정렬은 name asc, id asc로 고정한다. 미인증이면 401.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{projectId}:
    get:
      tags: [Project]
      summary: 프로젝트 상세 — 작업공간 홈 (SPEC AC25)
      description: >-
        프로젝트 멤버만(AC12). 연결·비교 분석·첫 QA 상태와 멤버 수·대기 초대 수·상태별 이슈 수를 한 번에 돌려준다.
        issue_counts는 5개 상태를 모두 담는다(0 포함).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Project]
      summary: 프로젝트 삭제 (SPEC AC26)
      description: >-
        소유자만(그 외 403, 아무것도 지우지 않음). 프로젝트와 그 안의 이슈·재검증·알림·스타일 차이·scan·동기화·프레임·임베딩·실행·초대·멤버십을
        한 트랜잭션으로 모두 지운다 — 되돌릴 수 없다. 멤버 계정과 다른 프로젝트는 그대로. 비교 분석·첫 QA가 실행 중이면 409 NOT_READY.
        이름을 입력해 확인하는 단계는 화면에서 한다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: 삭제됨
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/connections/figma:
    put:
      tags: [Project]
      summary: Figma 페이지·섹션 연결 (SPEC AC21)
      description: >-
        소유자만(그 외 403). url은 최종 시안만 담은 페이지([공유하기]) 또는 섹션([링크 복사])의 링크(figma.com/design/{key}/{이름}?node-id={페이지·섹션 id})다(2026-11-07).
        node-id가 없거나 페이지·섹션이 아니면(프레임 등) 400. 파일 이름과 그 페이지·섹션의 id·이름·scope를 저장하고 이후 분석은 그 안만 본다.
        서버 Figma 토큰으로 파일을 읽을 수 있는지 확인한 뒤에만 저장한다 — 보기 권한이 없으면 422 CONNECTION_FORBIDDEN,
        없는 파일·응답 지연이면 502 CONNECTION_FAILED, 서버 Figma 토큰이 없거나 만료·잘못됐으면 503 FIGMA_UNAVAILABLE이고(Figma는 만료 토큰도 403으로 주지만
        본문의 "Token expired"·"Invalid token"으로 구분해 사용자 권한 문제로 안내하지 않는다) 기존 연결은 그대로다.
        비교 분석이 성공한 뒤에는 바꿀 수 없다(409 NOT_READY).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
      responses:
        '200':
          description: 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ConnectionForbidden'
        '502':
          $ref: '#/components/responses/ConnectionFailed'

  /projects/{projectId}/connections/github:
    put:
      tags: [Project]
      summary: GitHub 공개 저장소 연결 (SPEC AC21)
      description: >-
        소유자만(그 외 403). url은 github.com/{owner}/{repo} 형식이어야 한다(400). 서버 토큰(없으면 익명)으로 저장소를 읽을 수 있는지
        확인한 뒤에만 저장한다 — GitHub가 404를 주면(비공개와 없는 저장소를 구분해 주지 않는다) 422 CONNECTION_FORBIDDEN,
        응답 지연·GitHub 서버 오류면 502 CONNECTION_FAILED.
        코드만 읽고 이슈·PR은 다루지 않는다(N13). 비교 분석이 성공한 뒤에는 바꿀 수 없다(409 NOT_READY).
        분석할 브랜치를 고른다(2026-11-07): branch를 빼면 저장소 기본 브랜치, 보내면 그 브랜치가 저장소에 있어야 한다(없으면 400).
        응답의 branches(이름순, 최대 100개)로 화면이 브랜치 선택 목록을 보여 주고, 바꾸면 같은 url과 새 branch로 다시 보낸다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubConnectRequest'
      responses:
        '200':
          description: 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ConnectionForbidden'
        '502':
          $ref: '#/components/responses/ConnectionFailed'

  /projects/{projectId}/analysis:
    post:
      tags: [Project]
      summary: 비교 분석 시작 — Figma 노드 ↔ 코드 위치 매핑 (SPEC AC22)
      description: >-
        소유자만(403). Figma·GitHub가 둘 다 연결돼 있어야 하고, 실행 중이거나 이미 성공했으면 409 NOT_READY.
        실패하면 다시 시작할 수 있다. 이슈·StyleMismatch를 만들지 않는다(N16).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Project]
      summary: 최근 비교 분석 상태
      description: 프로젝트 멤버 누구나. 실행한 적이 없으면 data가 null이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'

  /projects/{projectId}/analysis/mappings:
    get:
      tags: [Project]
      summary: 디자인-코드 매핑 조회 (SPEC AC27)
      description: >-
        프로젝트 멤버 누구나(비멤버 403). 가장 최근에 성공한 비교 분석의 매핑을 frame_name asc, frame_id asc로,
        프레임마다 nodes를 node_name asc, node_id asc로 돌려준다. 성공한 분석이 없으면 items는 빈 배열이고 run은 null이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignCodeMappingListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/first-qa:
    post:
      tags: [Project]
      summary: 첫 QA 실행 — 차이를 이슈로 자동 저장 (SPEC AC23)
      description: >-
        소유자만(403). 비교 분석이 성공했고 첫 QA가 아직 성공하지 않았을 때만 실행한다(그 외 409 NOT_READY). 실패하면 다시 실행할 수 있다.
        매핑된 짝마다 Figma 노드 값과 코드 값을 비교해, 둘 다 실제로 확인된 차이만 이슈(source first_qa, status needs_check,
        reported_by=요청자, assigned_team 없음, platform_scope common)로 저장한다(N17). 실패한 실행은 이슈를 하나도 남기지 않는다.
        scope(검증 범위, 시안 QA-01)는 1개 이상, 비었거나 정해진 값이 아니면 400.
        개발용 가짜 비교기(app.qa.fake-comparator=true, 기본 false)가 켜져 있으면 실행에 demo true, 이슈 description 앞에 [시연용]이 붙는다(2026-11-08).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [size_spacing, color_typography, border_radius, text] }
                  description: '간격·여백(spacing — padding·gap) / 색상·타이포그래피(color 글자·배경·테두리, font_weight, font_size) / 모서리(radius) / 고정 문구(text). 고른 범위의 property만 비교한다(2026-11-10 스파이크)'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Project]
      summary: 최근 첫 QA 상태와 만든 이슈 수
      description: 프로젝트 멤버 누구나. 실행한 적이 없으면 data가 null이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'

  /projects/{projectId}/re-qa:
    post:
      tags: [Project]
      summary: 자동 Re-QA 실행 — 수정 완료된 첫 QA 이슈를 다시 비교 (SPEC AC28, 2026-11-08)
      description: >-
        소유자만(403). status fixed이고 source first_qa인 이슈가 1건 이상이고 첫 QA·Re-QA가 실행 중이 아닐 때만 실행한다(그 외 409 NOT_READY).
        이슈마다 첫 QA와 같은 노드·같은 파일을 현재 브랜치 최신 커밋에서 다시 비교해, 같으면 Verification(pass, source re_qa) → resolved,
        다르면 fail → needs_recheck(담당 팀에 recheck_failed 알림, AC11). 다시 읽지 못한 이슈는 fixed로 두고 skipped_count에 센다(N18).
        실행이 실패하면 어떤 이슈도 바꾸지 않는다.
        검증 범위(2026-11-10): scope를 빼면 지금까지 검사한 범위(covered_scope)와 같다. 검사한 범위를 빼면 400.
        새로 더한 범위(added_scope)가 있으면 같은 실행에서 그 범위만 첫 QA와 같은 방식으로 매핑 전체를 Re-QA가 읽은 커밋에서 비교해
        새 이슈(source first_qa, needs_check, 담당 팀 없음)로 저장한다(found_count·found_dropped_count). 이때는 fixed 이슈가 없어도 되고,
        성공한 첫 QA가 없으면 409. 판정과 새 이슈는 한 트랜잭션 — 실패하면 아무것도 남지 않고 범위도 더해지지 않는다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [size_spacing, color_typography, border_radius, text] }
                  description: '지금까지 검사한 범위(covered_scope)를 모두 담아야 한다. 그 밖의 값은 새로 비교할 범위'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Project]
      summary: 최근 Re-QA 상태와 해결·재실패·건너뜀 수
      description: 프로젝트 멤버 누구나. 실행한 적이 없으면 data가 null이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'

  /projects/{projectId}/deploy-url:
    put:
      tags: [Project]
      summary: 배포 주소 저장 — 실시간 QA 워크스페이스가 띄울 주소 (SPEC AC29, 2026-11-10)
      description: >-
        소유자만(403). http(s) 주소이고 scan과 같은 주소 제한(내부망·루프백 거부)을 통과해야 저장한다(아니면 400). url이 null이면 지운다.
        응답은 GET deploy-target과 같다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployTargetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/deploy-target:
    get:
      tags: [Project]
      summary: 배포 대상 — 저장된 주소, 없으면 GitHub 최근 성공 배포 주소 (SPEC AC29)
      description: >-
        프로젝트 멤버 누구나. source는 manual(저장된 주소) > github_deployment(연결된 저장소의 최근 성공 배포 environment_url) > none 순.
        주소가 있으면 서버가 한 번 요청해 X-Frame-Options·CSP frame-ancestors로 화면 삽입 가능 여부를 판단한다(확인 못 하면 null).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployTargetResponse'

  /projects/{projectId}/captures:
    post:
      tags: [QAIssue]
      summary: 배포 화면 캡처 — 서버 브라우저가 같은 경로·화면 크기로 렌더링 (SPEC AC30)
      description: >-
        프로젝트 멤버 누구나. 배포 주소가 없으면 409 NOT_READY, 주소 제한·열기 실패면 502 CAPTURE_FAILED(아무것도 저장하지 않음).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_path, viewport]
              properties:
                page_path: { type: string, description: '/로 시작', maxLength: 500 }
                viewport: { $ref: '#/components/schemas/Viewport' }
      responses:
        '201':
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QaCaptureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/captures/upload:
    post:
      tags: [QAIssue]
      summary: 이미지 첨부 — 화면 삽입이 막혔거나 캡처에 실패했을 때 (SPEC AC30)
      description: png·jpeg·webp, 5MB 이하(내용으로 형식 확인). 그 밖은 400.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QaCaptureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/captures/{captureId}/image:
    get:
      tags: [QAIssue]
      summary: 캡처 이미지 (그 프로젝트 멤버만, AC12)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: captureId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 이미지
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/figma/frames/{frameId}/preview:
    get:
      tags: [Figma]
      summary: 자동 QA 항목의 Figma 프레임 이미지와 비교한 노드 위치 (SPEC AC32, 2026-11-10)
      description: >-
        프로젝트 멤버 누구나. 연결된 Figma 파일에서 프레임을 PNG로 렌더링한 임시 이미지 주소, 프레임 크기, node_id가 있으면 그 노드의 프레임 기준 비율 상자.
        id 형식 오류 400, Figma 미연결 409 NOT_READY, 토큰 없음 503 FIGMA_UNAVAILABLE, 프레임 없음 404, Figma 실패 502 CONNECTION_FAILED. 결과는 30분 기억한다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: frameId
          in: path
          required: true
          schema: { type: string, example: '607:36654' }
        - name: node_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      frame_id: { type: string }
                      node_id: { type: string, nullable: true }
                      image_url: { type: string, description: Figma가 준 임시 이미지 주소 }
                      width: { type: integer }
                      height: { type: integer }
                      node_box:
                        type: object
                        nullable: true
                        properties:
                          x_ratio: { type: number }
                          y_ratio: { type: number }
                          w_ratio: { type: number }
                          h_ratio: { type: number }
                  error: { type: object, nullable: true, example: null }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/manual-qa:
    post:
      tags: [QAIssue]
      summary: 수동 QA 등록 — 배포 화면 위치(핀)와 함께 (SPEC AC31, 2026-11-10)
      description: >-
        프로젝트 멤버 누구나. 이슈(source manual, needs_check, 담당 팀 없음, platform_scope common, environment.platform web)와
        위치(ManualQaPin)를 한 트랜잭션으로 저장한다. screen_location·repro_steps는 찍은 위치에서 서버가 만든다.
        같은 client_request_id로 이미 만든 이슈가 있으면 200으로 그 이슈를 돌려준다. 담당 팀이 없으므로 알림은 없다(AC3).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, title, description, location_basis]
              properties:
                client_request_id: { type: string, maxLength: 64 }
                title: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                page_path: { type: string, maxLength: 500 }
                anchor:
                  type: object
                  required: [x_px, y_px]
                  properties:
                    x_px: { type: integer }
                    y_px: { type: integer }
                viewport: { $ref: '#/components/schemas/Viewport' }
                location_basis: { type: string, enum: [live_overlay, capture_image, none], description: 'none=위치 없이 등록(배포 화면 없어도 됨) — anchor·viewport 없이, page_path나 figma_frame_id 중 하나 이상과 repro_steps 필수' }
                repro_steps: { type: array, items: { type: string, maxLength: 500 }, maxItems: 10, description: 'location_basis none일 때 필수(사람이 적는다). 그 외에는 서버가 위치에서 만든다' }
                capture_id: { type: string, nullable: true }
                capture_status: { type: string, enum: [failed, none], description: 'capture_id가 없을 때만. 기본 none' }
                severity: { type: string, enum: [critical, high, medium, low], nullable: true }
                expected_result: { type: string, nullable: true, maxLength: 1000 }
                actual_result: { type: string, nullable: true, maxLength: 1000 }
                figma_frame_id: { type: string, nullable: true, description: '이 화면의 기준 Figma 프레임(AC33). 최근 성공한 비교 분석 매핑에 있어야 한다. 없으면 서버가 고르지 않는다' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '200':
          description: 같은 client_request_id로 이미 등록된 이슈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/screen-links:
    get:
      tags: [Project]
      summary: 화면 경로 ↔ Figma 프레임 연결 목록 (SPEC AC33, 2026-11-10)
      description: 프로젝트 멤버 누구나. page_path asc, frame_name asc, frame_id asc
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ScreenFrameLink' }
                  error: { type: object, nullable: true, example: null }

  /projects/{projectId}/screen-links/{frameId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: frameId
        in: path
        required: true
        schema: { type: string, example: '12:34' }
    put:
      tags: [Project]
      summary: 프레임에 배포 화면 경로 연결 (SPEC AC33)
      description: >-
        소유자만(403). 프레임은 최근 성공한 비교 분석 매핑에 있어야 한다(400). page_path는 /로 시작, 500자 이하, ?·# 없음(400).
        :이름 조각은 어떤 한 조각과도 맞는다. 이미 있으면 바꾼다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_path]
              properties:
                page_path: { type: string, maxLength: 500, example: '/app/projects/:projectId' }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/ScreenFrameLink' }
                  error: { type: object, nullable: true, example: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Project]
      summary: 프레임의 화면 경로 연결 삭제 (SPEC AC33)
      description: 소유자만(403). 연결이 없어도 204
      responses:
        '204':
          description: 삭제됨
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/members:
    get:
      tags: [Project]
      summary: 프로젝트 멤버 목록 (담당 팀 구성 확인용, SPEC AC15)
      description: >-
        그 프로젝트의 멤버만 호출할 수 있다(미인증 401, 비멤버 403 — AC12). 정렬은 name asc, id asc로 고정한다.
        `reported_by`·`verified_by`·`changed_by` 등 멤버를 가리키는 값은 모두 여기 나오는 `id`다. 담당 팀(assigned_team)은 이 목록의 role로 구성된다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/members/{memberId}:
    patch:
      tags: [Project]
      summary: 멤버 역할 변경 (SPEC AC24)
      description: >-
        소유자만(그 외 403). 소유자 본인 역할도 바꿀 수 있다. 그 프로젝트 멤버가 아니면 404, role이 정해진 값이 아니면 400.
        이슈·담당자·알림은 바꾸지 않는다(알림 종류 3개 고정 — N5).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [designer, frontend, backend, planner] }
      responses:
        '200':
          description: 바뀐 멤버
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Project]
      summary: 멤버 제거 (SPEC AC19)
      description: >-
        소유자만 할 수 있다(그 외 403). 소유자 자신은 제거할 수 없다(409). 이슈는 팀에 배정되므로 제거해도
        이슈(담당 팀·상태·status_history)·알림·재검증 기록은 그대로 둔다(N15, 2026-11-08).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 제거됨
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/invitations:
    post:
      tags: [Invitation]
      summary: 구글 이메일로 초대 (SPEC AC17)
      description: >-
        프로젝트 멤버 누구나 초대할 수 있다. 7일 뒤 만료되는 pending 초대를 1건 만들고 그 이메일로 초대 메일을 1통 보낸다.
        이미 멤버인 이메일이면 409. 같은 이메일에 pending 초대가 있으면 새로 만들지 않고 그 초대의 만료를 지금부터 7일로 늘리고
        수락 링크 토큰을 새로 발급해 메일을 다시 보낸다(200, 이전 링크 무효 — 2026-11-07).
        메일 발송이 실패해도 초대는 남는다(초대받은 사람은 로그인 후 GET /invitations/mine으로 수락 가능).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '200':
          description: 대기 중 초대를 연장해 다시 보냄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Invitation]
      summary: 이 프로젝트의 대기 중인 초대 목록
      description: 프로젝트 멤버만(AC12). 정렬은 created_at desc, id desc로 고정한다. 토큰은 담지 않는다(N14).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'

  /projects/{projectId}/invitations/{invitationId}:
    delete:
      tags: [Invitation]
      summary: 초대 취소
      description: 초대한 사람 또는 소유자만(그 외 403). pending이 아니면 409.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 취소됨
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/invitations/{invitationId}/resend:
    post:
      tags: [Invitation]
      summary: 초대 재전송 — 만료 7일 연장 (SPEC AC17)
      description: >-
        프로젝트 멤버 누구나. pending 초대만(그 외 409 INVITATION_CLOSED). 새 초대를 만들지 않고 expires_at을 지금부터 7일로 늘리고,
        수락 링크 토큰을 새로 발급해 메일을 1통 보낸다(이전 링크 무효). 토큰은 응답에 담지 않는다(N14).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 연장된 초대
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invitations/mine:
    get:
      tags: [Invitation]
      summary: 내게 온 대기 중인 초대 (앱 안 초대함)
      description: 로그인한 구글 이메일로 온 pending·만료 전 초대만. 정렬 created_at desc, id desc. 수락은 각 항목의 id로 POST /invitations/mine/{invitationId}/accept.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invitations/mine/{invitationId}/accept:
    post:
      tags: [Invitation]
      summary: 앱 안 초대함에서 수락 (SPEC AC18)
      description: 메일 링크 수락과 같은 규칙이다 — 로그인 이메일이 초대 이메일과 같아야 하고(403), pending·만료 전이어야 한다(409).
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: 멤버가 됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invitations/{token}:
    get:
      tags: [Invitation]
      summary: 초대 미리보기 (메일의 수락 링크로 들어왔을 때)
      description: 로그인만 필요. 프로젝트 이름·초대한 사람·초대받은 이메일·상태·만료 시각을 보여준다. 없는 토큰은 404.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{token}/accept:
    post:
      tags: [Invitation]
      summary: 메일 링크로 수락 (SPEC AC18)
      description: >-
        로그인한 구글 이메일이 초대받은 이메일과 같지 않으면 403, 초대가 만료·취소·이미 수락됨이면 409, role이 정해진 값이 아니면 400.
        그 밖에는 고른 role의 멤버가 되고 초대는 accepted가 된다. 거부된 요청은 멤버를 만들지 않는다(N14).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: 멤버가 됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/notifications:
    get:
      tags: [Notification]
      summary: 내게 온 알림 목록 (SPEC AC14)
      description: >-
        요청자 본인이 받는 알림(to_member_id = 요청자)만 반환한다. 다른 멤버의 알림은 담지 않는다.
        정렬은 created_at desc, id desc로 고정한다. 읽음 처리·삭제는 v1에 없다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: event
          in: query
          schema:
            type: string
            enum: [issue_created, fixed, recheck_failed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login/google:
    get:
      tags: [Auth]
      summary: 구글 로그인 시작
      description: >-
        브라우저 전체 리다이렉트 전용 (fetch로 호출하지 말 것). `<a href>` 클릭 등으로 이동시키면
        구글 로그인 화면으로 리다이렉트됨. 로그인 성공 시 `app.oauth2.login-success-redirect`
        설정값(프론트 주소)으로 다시 리다이렉트됨.
      security: []
      responses:
        '302':
          description: accounts.google.com으로 리다이렉트

  /auth/callback/google:
    get:
      tags: [Auth]
      summary: 구글 OAuth 콜백 (구글이 호출, 직접 호출 금지)
      description: >-
        Google Cloud Console에 등록된 리디렉션 URI(`{baseUrl}/api/v1/auth/callback/google`)로
        구글이 인가 코드와 함께 호출하는 내부 엔드포인트. 우리 프론트/클라이언트가 직접 호출할 일 없음.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 로그인 성공 시 프론트 주소로, 실패 시 에러 페이지로 리다이렉트

  /auth/me:
    get:
      tags: [Auth]
      summary: 로그인 상태 확인
      description: >-
        인증 여부와 무관하게 200으로 응답 (미인증이면 authenticated:false). 로그인했으면 `id`는 내 멤버 id로,
        `owner_id`·`reported_by` 등과 비교해 내 것인지 판단하는 데 쓴다(2026-11-05 추가).
        처음 로그인한 구글 계정은 이 호출에서 Member가 만들어진다(AC16). name·email은 Member 값, picture는 구글 프로필 값이다.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean
                  id:
                    type: string
                    description: 내 멤버 id (로그인했을 때만)
                  name:
                    type: string
                  email:
                    type: string
                  picture:
                    type: string
                    nullable: true
              examples:
                authenticated:
                  value: { authenticated: true, id: '12', name: 홍길동, email: hong@example.com, picture: 'https://...' }
                anonymous:
                  value: { authenticated: false }

  /auth/logout:
    get:
      tags: [Auth]
      summary: 로그아웃
      description: >-
        의도적으로 GET — 로그인 버튼과 동일하게 `<a href>` 링크만으로 동작하도록 함
        (POST로 바꾸려면 프론트에서 CSRF 토큰 처리 필요, 아직 TODO)
      security: []
      responses:
        '302':
          description: 세션 종료 후 '/' 로 리다이렉트

  /projects/{projectId}/figma/sync:
    post:
      tags: [Figma]
      summary: Figma 파일에서 프레임/디자인 토큰 동기화
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [figma_file_key]
              properties:
                figma_file_key:
                  type: string
                frame_ids:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: 없으면 전체 동기화
      responses:
        '202':
          description: 동기화 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/figma/sync/{syncId}:
    get:
      tags: [Figma]
      summary: 동기화 작업 상태 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: syncId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaSyncStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/figma/frames:
    get:
      tags: [Figma]
      summary: 동기화된 프레임 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaFrameListResponse'

  /projects/{projectId}/style-mismatches/scan:
    post:
      tags: [StyleMismatch]
      summary: Figma 프레임 vs 배포 화면 스타일 자동 비교 실행 (v1 포함, SPEC.md 4절)
      description: >-
        범위는 웹 화면의 단일 컴포넌트, color·font_weight·radius 3개 property로 한정한다. 한쪽 값 추출에 실패하면
        그 property는 저장하지 않는다(AC2). 동작 방식(2026-11-05 구현으로 확정): 서버가 Figma REST API로
        `node_id`의 값을 읽고(토큰은 서버 환경변수 `FIGMA_ACCESS_TOKEN`), 헤드리스 Chromium(Playwright)으로 `target_url`을 열어
        `selector`가 가리키는 요소의 getComputedStyle을 읽어 비교한다. `frame_id`는 figma/sync로 가져온 프레임이어야 하고,
        `node_id`는 그 프레임 안에 있어야 한다.

        비교 규칙(스파이크 2026-09-28 기준): color 채널별 ±2, font_weight 정확히 일치, radius ±1px. 값이 다른 property만
        StyleMismatch로 저장한다(`#RRGGBB` / `600` / `8px` 형식). Figma 노드가 TEXT면 CSS 글자색(color)과, 그 외에는
        배경색(background-color)과 비교한다. 투명도·그라디언트·모서리마다 다른 반경처럼 값 하나로 정할 수 없는 경우는
        추출 실패로 보고 비교하지 않는다(N3). 비교할 수 있는 property가 하나도 없거나, selector가 요소 0개 또는 2개 이상에
        맞으면 scan은 failed가 되고 이유는 상태 조회의 `error_message`에 남는다.

        `target_url` 제한(2026-11-04 결정, 내부망 접근 차단): http/https만, 사용자 정보(user@host) 불가, 1000자 이하.
        사설·링크로컬(클라우드 메타데이터 169.254.169.254 포함)·CGNAT·멀티캐스트 등 내부 주소로 풀리는 호스트는 거부한다.
        localhost(루프백)는 서버 환경변수 `SCAN_ALLOW_LOCALHOST=true`일 때만 허용한다(로컬 개발용, 배포 서버에서는 끔).
        화면이 여는 모든 요청과 리다이렉트도 단계마다 같은 규칙으로 검사해 막는다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame_id, node_id, target_url, selector]
              properties:
                frame_id:
                  type: string
                  description: 비교 기준 FigmaFrame (figma/sync로 동기화된 프레임)
                node_id:
                  type: string
                  description: frame_id 안에서 비교할 컴포넌트의 Figma 노드 ID (예 84:759)
                target_url:
                  type: string
                  description: 비교 대상 Screen의 배포 URL
                selector:
                  type: string
                  description: target_url 화면에서 node_id와 짝지을 요소의 CSS selector
      responses:
        '202':
          description: 비교 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchScanResponse'
        '400':
          description: >-
            필수 항목 누락, frame_id·node_id 형식 오류, selector 500자 초과, 허용하지 않는 target_url,
            figma/sync로 동기화되지 않은 frame_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 서버에 Figma 토큰이 설정되지 않음 (error.code FIGMA_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/style-mismatches/scans/{scanId}:
    get:
      tags: [StyleMismatch]
      summary: 비교 작업 상태 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchScanStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/style-mismatches:
    get:
      tags: [StyleMismatch]
      summary: 발견된 스타일 차이 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: frame_id
          in: query
          schema:
            type: string
        - name: property
          in: query
          schema:
            type: string
            enum: [color, font_weight, font_size, font_family, radius, shadow, spacing, text]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchListResponse'

  /projects/{projectId}/style-mismatches/{mismatchId}:
    get:
      tags: [StyleMismatch]
      summary: 스타일 차이 상세
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MismatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/style-mismatches/{mismatchId}/issues:
    post:
      tags: [QAIssue]
      summary: 스타일 차이(StyleMismatch)로부터 QA Issue 생성 (자동 경로)
      description: >-
        차이의 expected_value·actual_value가 이슈의 style_mismatch로 옮겨진다. 재현 정보는 요청에서 받는다(AC1).
        자동 경로 자체의 포함 여부는 스파이크(docs/spikes/) 결과로 정한다 — SPEC.md 4절.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MismatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screen_location, repro_steps, platform_scope]
              properties:
                description: { type: string }
                screen_location: { type: string }
                repro_steps:
                  type: array
                  items: { type: string }
                platform_scope: { type: string, enum: [common, aos, ios] }
                environment:
                  $ref: '#/components/schemas/Environment'
      responses:
        '201':
          description: Created (status = needs_check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/parse:
    post:
      tags: [QAIssue]
      summary: 자유서술 이슈 텍스트를 IssueReportContext로 파싱 (SPEC AC8)
      description: >-
        텍스트에 없는 화면·요소·환경 값은 지어내지 않고 비워 두며, 빠진 항목을 missing에 담아 되묻는다.
        프롬프트 정본은 src/qating/prompts/parse_query.md.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "아이콘 너무 커요" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/qa-issues:
    post:
      tags: [QAIssue]
      summary: QA Issue 등록 (SPEC AC1·AC2·AC3)
      description: >-
        재현 정보(screen_location, repro_steps, platform_scope)가 하나라도 비면 400과 빠진 항목 이름을 반환한다(AC1).
        style_mismatch는 expected_value와 actual_value가 둘 다 있어야 저장된다(AC2).
        등록되면 담당자에게 Notification(event: issue_created)이 생성된다(AC3).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, screen_location, repro_steps, platform_scope]
              properties:
                description: { type: string }
                screen_location: { type: string, description: 어느 화면의 어느 요소인지 }
                repro_steps:
                  type: array
                  items: { type: string }
                platform_scope: { type: string, enum: [common, aos, ios], description: 이슈 분류용(common = AOS·iOS 모두) }
                environment:
                  $ref: '#/components/schemas/Environment'
                screenshots:
                  type: array
                  items: { type: string, format: uri }
                figma_link: { type: string, nullable: true }
                style_mismatch:
                  $ref: '#/components/schemas/StyleMismatch'
                manual_qa:
          type: object
          nullable: true
          description: 실시간 QA 워크스페이스에서 위치를 찍어 등록한 수동 QA만(AC31, 2026-11-10)
          allOf:
            - $ref: '#/components/schemas/ManualQaPin'
        assigned_team: { type: string, enum: [planner, designer, frontend, backend], nullable: true, description: '담당 팀 — 그 프로젝트에서 이 역할인 멤버들(기획팀·디자인팀·프론트엔드팀·백엔드팀, 2026-11-08)' }
      responses:
        '201':
          description: Created (status = needs_check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [QAIssue]
      summary: QA Issue 목록 조회 (status=fixed → 재확인 대기 이슈, source=first_qa → 첫 QA 결과)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          schema:
            type: string
            enum: [needs_check, in_progress, fixed, needs_recheck, resolved]
        - name: source
          in: query
          schema:
            type: string
            enum: [manual, first_qa]
        - name: assigned_team
          in: query
          schema:
            type: string
            enum: [planner, designer, frontend, backend]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueListResponse'

  /projects/{projectId}/qa-issues/{issueId}:
    get:
      tags: [QAIssue]
      summary: QA Issue 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [QAIssue]
      summary: 상태·담당 팀 수정 (SPEC AC3·AC4·AC6·AC13)
      description: >-
        PATCH로 허용되는 상태 전이는 needs_check·needs_recheck → in_progress, in_progress → fixed, needs_check·needs_recheck → fixed 뿐이다(AC6, in_progress 2026-11-07).
        fixed → resolved / needs_recheck는 재검증 등록이나 Re-QA로만 바뀐다. 그 밖의 전이는 409.
        fixed로 바뀌면 등록자에게 Notification(event: fixed)이 생성된다(AC4).
        status(in_progress·fixed)는 프로젝트 역할이 그 이슈의 assigned_team인 멤버만 요청할 수 있다(팀이 없으면 누구도 불가, 그 외 403, AC13).
        in_progress는 알림을 만들지 않는다. 권한 검사가 전이 검사보다 먼저다.
        assigned_team을 새로 지정·변경하면 그 역할 멤버 각각에게 issue_created 알림 1건씩(AC3). 정해진 4개 값이 아니면 400,
        null로 비우는 요청도 400이다(지정·변경만 가능). body에 status·assigned_team 외의 필드가 오면 400(N6).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [in_progress, fixed]
                assigned_team:
                  type: string
                  enum: [planner, designer, frontend, backend]
                  description: 담당 팀. null 불가
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/qa-issues/{issueId}/github-sync:
    post:
      tags: [QAIssue]
      deprecated: true
      summary: GitHub Issue 생성 및 연동 — v1 비포함 (SPEC.md 4절, v2 후보)
      description: >-
        v1 범위에서 제외. 응답자들이 쓰는 이슈 트래커가 Jira·Notion·엑셀로 제각각이라(interviews.md 로그 2, 8, 11, 12)
        외부 트래커 연동은 v2에서 다시 판단한다. 설계 기록으로만 남겨 둔다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  example: tjfakstn/ACJB
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSyncResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/{issueId}/code-trace:
    get:
      tags: [QAIssue]
      summary: 코드 추적 — 코드 위치, 문제 코드가 들어온 커밋·PR, 고친 커밋·PR (SPEC AC34, 2026-11-10)
      description: >-
        프로젝트 멤버 누구나. GitHub는 읽기만 한다. GitHub가 연결되지 않았거나 읽지 못해도 200 — github 필드로 알린다.
        fixes는 이슈 키(QA-{id})가 정확히 들어간 커밋·PR, 담당 팀이 붙인 링크, Re-QA 커밋이고 시각 내림차순이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CodeTrace' }
                  error: { type: object, nullable: true, example: null }
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/{issueId}/fix-link:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IssueId'
    put:
      tags: [QAIssue]
      summary: 수정 PR·커밋 링크 붙이기 (SPEC AC34)
      description: >-
        그 이슈 담당 팀 역할 멤버만(403). 연결된 저장소의 https://github.com/{owner}/{repo}/pull/{번호} 또는 /commit/{sha}만(400).
        이슈에 하나만 저장하고 상태·알림·이력은 바꾸지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 500, example: 'https://github.com/tjfakstn/ACJB/pull/42' }
      responses:
        '200':
          description: 저장됨 — 갱신된 코드 추적
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/CodeTrace' }
                  error: { type: object, nullable: true, example: null }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [QAIssue]
      summary: 수정 링크 지우기 (SPEC AC34)
      description: 담당 팀 역할 멤버만(403). 없어도 204
      responses:
        '204':
          description: 지움
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/qa-issues/{issueId}/verifications:
    post:
      tags: [Verification]
      summary: 재검증 결과 등록 (SPEC AC5·AC7)
      description: >-
        상태가 fixed인 이슈에만 등록할 수 있다(그 외 409). pass면 이슈를 resolved로, fail이면 needs_recheck로 바꾸고
        status_history에 남긴다(AC7). 응답에 이슈의 최초 repro_steps를 그대로 담아 재입력 없이 쓰게 한다(AC5).
        그 이슈의 reported_by만 등록할 수 있다. reported_by가 더 이상 프로젝트 멤버가 아니면 프로젝트 소유자가 대신 등록한다(그 외 403, AC13, 2026-11-05). fail이면 담당자에게 Notification(event: recheck_failed)이 생성된다(AC11).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [pass, fail]
                scope:
                  type: string
                  nullable: true
                  description: 재확인 범위(해당 화면만 / 관련 화면 전체)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCreateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Verification]
      summary: 해당 이슈의 재검증 이력 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationListResponse'

  /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions:
    post:
      tags: [Verification]
      summary: 재검증 범위 제안 (SPEC AC20, 2026-11-06)
      description: >-
        fixed 이슈를 재검증하기 전에, 같은 프로젝트의 이슈·스타일 차이·fail 재검증 기록 중 그 이슈와 의미가 가까운 문서를
        임베딩(Voyage AI)으로 최대 8개 검색해 LLM(Claude)에 주고, 같이 다시 볼 화면을 최대 5개 근거와 함께 돌려준다.
        재검증 등록 권한자(AC13 — 등록자, 등록자가 제거됐으면 소유자)만 요청할 수 있고(그 외 403), fixed가 아니면 409
        INVALID_TRANSITION이다. 403·404·409일 때는 외부 호출을 하지 않는다. evidence가 비었거나 하나라도 이번 검색 결과에
        없던 id를 단 제안은 서버가 버리고 dropped_count에 센다(N16). 검색 결과가 0건이면 LLM을 부르지 않고 빈 suggestions를
        돌려준다. 다른 프로젝트 문서는 검색하지 않는다. 결과는 저장하지 않으며, 이슈·StyleMismatch·Verification·알림을
        만들거나 바꾸지 않는다. 외부 유료 호출을 일으키고 결과가 매번 달라질 수 있어 GET이 아니라 POST다. 본문은 없다.
        설계 근거 docs/design-recheck-suggestions.md.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecheckSuggestionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: >-
            임베딩·LLM 키가 없거나 호출 실패, 또는 LLM 응답이 스키마를 벗어남 (error.code SUGGESTION_FAILED).
            일부 결과를 돌려주지 않는다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        구글 로그인(OAuth2) 성공 후 서버가 내려주는 세션 쿠키. 프론트는 fetch에 `credentials: 'include'`를 쓴다.
        로그인한 구글 이메일이 `Member`와 일치해야 프로젝트 API를 쓸 수 있다(AC12).
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >-
        상태를 바꾸는 요청(POST·PATCH)에 필요. 서버가 `XSRF-TOKEN` 쿠키로 내려주는 값을 이 헤더에 그대로 실어 보낸다.
        없거나 틀리면 403. GET은 필요 없다.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    MismatchId:
      name: mismatchId
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 로그인하지 않음 (SPEC AC12)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 프로젝트 멤버가 아니거나, 이 상태 변경을 할 권한이 없거나, CSRF 토큰이 없음 (SPEC AC12·AC13)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConnectionForbidden:
      description: 연결하려는 Figma 파일·GitHub 저장소에 접근 권한이 없음 (SPEC AC21, CONNECTION_FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConnectionFailed:
      description: 연결 확인 실패 — 없는 Figma 파일, 응답 지연, 외부 서버 오류 (SPEC AC21, CONNECTION_FAILED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 허용되지 않은 상태 전이(AC6) 또는 지금 할 수 없는 요청(NOT_READY 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- 공통 envelope ---
    Error:
      type: object
      properties:
        code:
          type: string
          description: >-
            서비스가 정한 오류 코드(2026-11-05 확정, 11-06 1개·11-07 3개·11-10 1개 추가 — 17개) — UNAUTHORIZED(401), FORBIDDEN(403), NOT_FOUND(404),
            VALIDATION_FAILED(400), INVALID_TRANSITION(409, AC6), CONCURRENT_UPDATE(409, 동시 요청 — 다시 시도),
            ALREADY_MEMBER(409), INVITATION_CLOSED(409, 만료·취소·이미 수락된 초대), OWNER_NOT_REMOVABLE(409),
            PARSE_FAILED(502, parse LLM 실패·스키마 위반), SUGGESTION_FAILED(502, 재검증 범위 제안의 임베딩·LLM 실패·스키마 위반, 2026-11-06 추가), FIGMA_UNAVAILABLE(503, 서버에 Figma 토큰 미설정),
            CONNECTION_FORBIDDEN(422, Figma 파일 보기 권한 없음·GitHub 404(비공개·없는 저장소) — AC21), CONNECTION_FAILED(502, 없는 Figma 파일·응답 지연·외부 서버 오류 — AC21),
            NOT_READY(409, 연결·분석 전 실행, 실행 중 중복, 이미 성공한 첫 QA·분석, 분석 후 링크 변경 — AC21~AC23, 배포 주소 없이 캡처 — AC30), CAPTURE_FAILED(502, 서버 브라우저가 배포 화면을 열거나 캡처하지 못함 — AC30, 2026-11-10), INTERNAL_ERROR(500). 프론트는 이 값으로 분기한다. 요청이 컨트롤러에 닿기 전 프레임워크 단계에서 거부되면
            HTTP 상태 이름이 온다(예 METHOD_NOT_ALLOWED) — 그래서 enum으로 막지 않는다.
          example: VALIDATION_FAILED
        message:
          type: string
          description: 사용자에게 보여 줄 수 있는 한국어 설명. 내부 오류 상세는 담지 않는다

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/Error'

    # --- 데이터 모델 (이름·값은 docs/ontology.yaml 대표어를 따른다) ---
    QAIssue:
      type: object
      description: QA 중 발견되어 등록·전달되는 수정 요청 한 건 (docs/ontology.yaml QAIssue)
      required: [id, project_id, description, screen_location, repro_steps, platform_scope, status, reported_by, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        description: { type: string }
        screen_location: { type: string }
        repro_steps:
          type: array
          items: { type: string }
        platform_scope: { type: string, enum: [common, aos, ios] }
        environment:
          $ref: '#/components/schemas/Environment'
        screenshots:
          type: array
          items: { type: string, format: uri }
        figma_link: { type: string, nullable: true }
        style_mismatch:
          type: object
          allOf:
            - $ref: '#/components/schemas/StyleMismatch'
          nullable: true
        status:
          type: string
          enum: [needs_check, in_progress, fixed, needs_recheck, resolved]
          default: needs_check
          description: 확인 필요 → (수정 중, 건너뛸 수 있음) → 조치 완료 → (재검증 pass) 해결 완료 / (fail) 재확인 필요 → 수정 중·조치 완료
        source:
          type: string
          enum: [manual, first_qa]
          default: manual
          description: manual=사람이 등록, first_qa=첫 QA가 근거로 자동 저장(AC23)
        status_history:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [needs_check, in_progress, fixed, needs_recheck, resolved] }
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
        assigned_team: { type: string, enum: [planner, designer, frontend, backend], nullable: true, description: '담당 팀 — 그 프로젝트에서 이 역할인 멤버들(기획팀·디자인팀·프론트엔드팀·백엔드팀, 2026-11-08)' }
        reported_by: { type: string, description: 등록자(등록한 사람)의 멤버 id. 로그인 사용자로 서버가 기록 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Viewport:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, minimum: 320, maximum: 3840 }
        height: { type: integer, minimum: 320, maximum: 2160 }

    ManualQaPin:
      type: object
      description: 배포 화면(또는 첨부 이미지) 위에 찍은 수동 QA 위치와 캡처 (docs/ontology.yaml ManualQaPin)
      properties:
        pin_number: { type: integer, description: '프로젝트별 1부터. 화면 표시 ID는 QA-M###' }
        title: { type: string }
        page_path: { type: string }
        page_url: { type: string, nullable: true, description: '등록할 때의 배포 주소 + 경로' }
        anchor:
          type: object
          properties:
            x_px: { type: integer }
            y_px: { type: integer }
            x_ratio: { type: number }
            y_ratio: { type: number }
        viewport: { $ref: '#/components/schemas/Viewport' }
        location_basis: { type: string, enum: [live_overlay, capture_image, none], description: none이면 anchor·viewport·page_path가 null일 수 있다 }
        capture_status: { type: string, enum: [captured, failed, user_attached, none] }
        capture_id: { type: string, nullable: true }
        severity: { type: string, enum: [critical, high, medium, low], nullable: true }
        expected_result: { type: string, nullable: true }
        actual_result: { type: string, nullable: true }
        figma_frame:
          type: object
          nullable: true
          description: 등록할 때 고른 기준 Figma 프레임(AC33). 이름은 등록 때 값
          properties:
            frame_id: { type: string }
            frame_name: { type: string }

    CodeTrace:
      type: object
      description: 이슈 상세의 코드 추적(AC34). GitHub는 읽기만 한다
      properties:
        issue_key: { type: string, example: QA-34, description: 커밋 메시지·PR 제목에 적으면 fixes에 연결된다 }
        code:
          type: object
          nullable: true
          description: 첫 QA가 값을 읽은 곳. 수동 QA는 null
          properties:
            basis: { type: string, enum: [element, screen], description: 'element=첫 QA가 값을 읽은 줄, screen=수동 QA 기준 프레임의 화면 파일(매핑)' }
            path: { type: string }
            line: { type: integer, nullable: true }
            symbol: { type: string, nullable: true, description: 비교 분석 매핑의 컴포넌트 이름 }
            commit_sha: { type: string, nullable: true }
            url: { type: string, nullable: true }
        related:
          type: array
          description: 같은 Figma 요소의 다른 첫 QA 이슈(id 오름차순)
          items:
            type: object
            properties:
              issue_id: { type: string }
              property: { type: string }
              expected_value: { type: string }
              actual_value: { type: string }
              status: { type: string }
        origin:
          type: object
          nullable: true
          description: 문제 코드가 들어온 커밋과 그 커밋의 PR
          properties:
            basis: { type: string, enum: [line, file] }
            commit: { $ref: '#/components/schemas/TraceCommit' }
            pull_requests:
              type: array
              items: { $ref: '#/components/schemas/TracePull' }
        fixes:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [commit, pull_request] }
              source: { type: string, enum: [key, manual, re_qa] }
              commit: { allOf: [{ $ref: '#/components/schemas/TraceCommit' }], nullable: true }
              pull_request: { allOf: [{ $ref: '#/components/schemas/TracePull' }], nullable: true }
              url: { type: string }
              verdict: { type: string, enum: [pass, fail], nullable: true, description: re_qa일 때만 }
        github: { type: string, enum: [ok, not_connected, unavailable] }

    TraceCommit:
      type: object
      properties:
        sha: { type: string }
        message: { type: string, nullable: true, description: 첫 줄 }
        author: { type: string, nullable: true }
        committed_at: { type: string, format: date-time, nullable: true }
        url: { type: string }

    TracePull:
      type: object
      properties:
        number: { type: integer }
        title: { type: string, nullable: true }
        state: { type: string, enum: [open, closed, merged], nullable: true }
        author: { type: string, nullable: true }
        url: { type: string }

    ScreenFrameLink:
      type: object
      description: 이 배포 화면 경로는 이 Figma 프레임을 보고 구현했다 (docs/ontology.yaml ScreenFrameLink)
      properties:
        frame_id: { type: string }
        frame_name: { type: string, description: 연결할 때의 프레임 이름 }
        page_path: { type: string, description: '/로 시작. :이름 조각은 어떤 한 조각과도 맞는다' }
        updated_at: { type: string, format: date-time }

    QaCapture:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [auto, upload] }
        page_url: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
        created_at: { type: string, format: date-time }

    QaCaptureResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/QaCapture' }
        error: { type: object, nullable: true, example: null }

    DeployTarget:
      type: object
      properties:
        url: { type: string, nullable: true }
        source: { type: string, enum: [manual, github_deployment, none] }
        manual_url: { type: string, nullable: true, description: '소유자가 저장한 주소(연결 관리 입력란용)' }
        embeddable: { type: boolean, nullable: true, description: 'false면 화면 삽입 제한(M-09B), null이면 확인 못 함' }
        embed_blocked_reason: { type: string, nullable: true }

    DeployTargetResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/DeployTarget' }
        error: { type: object, nullable: true, example: null }

    StyleMismatch:
      type: object
      description: Figma 기준값과 구현 값이 다른 스타일 차이 한 건. 두 값이 모두 있어야 저장된다(AC2)
      required: [property, expected_value, actual_value]
      properties:
        id: { type: string, readOnly: true }
        frame_id: { type: string, nullable: true, description: 기준이 된 FigmaFrame }
        node_id: { type: string, nullable: true, description: '비교한 Figma 노드(첫 QA·scan). 응답에만 담긴다(2026-11-10)' }
        screen: { type: string, nullable: true, description: 비교한 Screen(배포 화면) }
        property: { type: string, enum: [color, font_weight, font_size, font_family, radius, shadow, spacing, text] }
        expected_value: { type: string, description: Figma 기준값 }
        actual_value: { type: string, description: 구현 화면에 실제 적용된 값 }

    Environment:
      type: object
      description: 이슈가 발생·확인된 환경
      properties:
        platform: { type: string, enum: [aos, ios, web] }
        device: { type: string }
        browser: { type: string }
        deploy_stage: { type: string, enum: [local, staging, production] }

    IssueReportContext:
      type: object
      description: 자유서술 이슈 텍스트를 파싱한 구조화 결과 (정본 스키마는 src/qating/schemas/)
      properties:
        screen: { type: string, nullable: true }
        element: { type: string, nullable: true }
        symptom: { type: string, nullable: true }
        repro_steps:
          type: array
          items: { type: string }
        platform_scope: { type: string, enum: [common, aos, ios], nullable: true }

    Verification:
      type: object
      description: 수정 후 재확인 1회 (docs/ontology.yaml Verification)
      required: [id, qa_issue_id, result, verified_by, verified_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        result: { type: string, enum: [pass, fail] }
        scope: { type: string, nullable: true }
        source: { type: string, enum: [manual, re_qa], description: 'manual=등록자가 직접 재검증, re_qa=자동 Re-QA(AC28, 2026-11-08)' }
        observed_value: { type: string, nullable: true, description: Re-QA가 다시 읽은 구현 값(시안 RQA-03 수정 후). manual이면 null }
        verified_by: { type: string }
        verified_at: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name, owner_id]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        owner_id: { type: string, description: 소유자의 멤버 id (멤버 제거 버튼을 보여줄지 판단용) }
        created_at: { type: string, format: date-time, description: 만든 시각(시안 PRJ-04 생성일) }

    ProjectSummary:
      type: object
      description: 프로젝트 목록 카드(시안 PRJ-01, SPEC AC15). issue_count=QA 결과 n건, open_issue_count=FAIL n건(resolved가 아닌 이슈)
      required: [id, name, owner_id, figma_connected, github_connected, analysis_status, issue_count, open_issue_count, member_count, members_preview]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        owner_id: { type: string }
        figma_connected: { type: boolean }
        github_connected: { type: boolean }
        analysis_status: { type: string, enum: [none, queued, running, succeeded, failed] }
        last_analyzed_at: { type: string, format: date-time, nullable: true, description: 마지막으로 성공한 비교 분석의 끝난 시각 }
        issue_count: { type: integer }
        open_issue_count: { type: integer }
        member_count: { type: integer }
        members_preview:
          type: array
          maxItems: 3
          description: 이름순 앞 3명
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    Invitation:
      type: object
      description: 프로젝트 초대 한 건. 토큰은 담지 않는다(초대 메일의 수락 링크에만 있다, N14)
      required: [id, project_id, project_name, email, status, invited_by, expires_at, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, accepted, canceled, expired] }
        invited_by: { type: string, description: 초대한 멤버 id }
        invited_by_name: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AcceptInvitationRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [designer, frontend, backend, planner], description: 이 프로젝트에서 내 역할 }

    Member:
      type: object
      description: >-
        QA에 참여하는 팀원 (docs/ontology.yaml Member). 구글 로그인 이메일로 식별한다.
        role은 이 프로젝트에서의 역할이다(프로젝트마다 다를 수 있음, 2026-11-04)
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [designer, frontend, backend, planner], nullable: true, description: 'null=미지정(만든 사람은 역할 없이 시작, 2026-11-07)' }

    Notification:
      type: object
      description: 앱 내 알림 한 건 (정본 스키마는 src/qating/schemas/Notification.schema.json)
      required: [id, qa_issue_id, event, to_member_id, created_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        event: { type: string, enum: [issue_created, fixed, recheck_failed] }
        channel: { type: string, example: in_app }
        to_member_id: { type: string }
        created_at: { type: string, format: date-time }

    FigmaFrame:
      type: object
      properties:
        frame_id: { type: string }
        name: { type: string }
        frame_url: { type: string }
        last_synced_at: { type: string, format: date-time }

    # --- 응답 envelope (성공 시 success:true 고정, data만 다름) ---
    ProjectListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProjectSummary'
        error: { type: object, nullable: true, example: null }

    ConnectRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 500 }

    FigmaConnection:
      type: object
      required: [url, file_key, file_name, page_id, page_name, scope, connected_at]
      properties:
        url: { type: string }
        file_key: { type: string }
        file_name: { type: string }
        page_id: { type: string, description: '분석할 페이지 또는 섹션의 노드 id(예 424:2) — 이름은 호환을 위해 그대로 둔다' }
        page_name: { type: string, description: 그 페이지·섹션 이름 }
        scope: { type: string, enum: [page, section], description: page_id가 가리키는 노드 종류(2026-11-07) }
        connected_at: { type: string, format: date-time }

    GithubConnectRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 500 }
        branch: { type: string, maxLength: 100, description: 분석할 브랜치. 빼면 저장소 기본 브랜치 }

    GithubConnection:
      type: object
      required: [url, repo, default_branch, branch, connected_at]
      properties:
        url: { type: string }
        repo: { type: string, description: owner/repo }
        default_branch: { type: string }
        branch: { type: string, description: 분석할 브랜치(2026-11-07) }
        branches: { type: array, items: { type: string }, description: '연결 응답에만 — 고를 수 있는 브랜치 이름(이름순, 최대 100개)' }
        connected_at: { type: string, format: date-time }

    ProjectRun:
      type: object
      required: [id, kind, status, created_count, dropped_count, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [analysis, first_qa, re_qa] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        created_count: { type: integer, description: analysis는 매핑 수, first_qa는 만든 이슈 수, re_qa는 해결(pass)된 이슈 수 }
        dropped_count: { type: integer, description: 'first_qa·analysis는 근거가 모자라 버린 수(N17), re_qa는 다시 읽지 못해 건너뛴 수(skipped_count, N18)' }
        failed_count: { type: integer, nullable: true, description: re_qa에서 여전히 달라 fail로 판정한 수. 다른 kind는 null }
        scope:
          type: array
          nullable: true
          items: { type: string, enum: [size_spacing, color_typography, border_radius, text] }
          description: first_qa는 고른 검증 범위, re_qa는 그 실행의 전체 범위(이전 범위 + 새로 더한 범위). analysis는 null
        added_scope:
          type: array
          nullable: true
          items: { type: string, enum: [size_spacing, color_typography, border_radius, text] }
          description: re_qa에서 새로 더해 비교한 범위(없으면 빈 배열). 다른 kind는 null (2026-11-10)
        covered_scope:
          type: array
          nullable: true
          items: { type: string, enum: [size_spacing, color_typography, border_radius, text] }
          description: 'GET·POST first-qa·re-qa 응답에만 — 이 프로젝트에서 지금까지 검사한 범위(성공한 첫 QA 범위 ∪ 성공한 Re-QA의 added_scope). Re-QA 화면은 이 범위를 잠근다'
        found_count: { type: integer, nullable: true, description: re_qa가 새로 더한 범위에서 만든 이슈 수. 다른 kind는 null }
        found_dropped_count: { type: integer, nullable: true, description: re_qa가 새로 더한 범위에서 근거가 모자라 버린 수(N17). 다른 kind는 null }
        demo: { type: boolean, description: 개발용 가짜 비교기로 돈 실행이면 true(시연용 값, 2026-11-08) }
        error_message: { type: string, nullable: true, description: 사용자에게 보여 줄 실패 사유 }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    ProjectDetail:
      type: object
      required: [id, name, owner_id, created_at, my_role, analysis_status, first_qa_status, member_count, pending_invitation_count, issue_counts]
      properties:
        id: { type: string }
        name: { type: string }
        owner_id: { type: string }
        created_at: { type: string, format: date-time, description: 만든 시각(시안 WS 프로젝트 정보 "생성일", 2026-11-07 추가) }
        description: { type: string, nullable: true }
        my_role: { type: string, enum: [designer, frontend, backend, planner], nullable: true, description: null=미지정 }
        figma: { allOf: [{ $ref: '#/components/schemas/FigmaConnection' }], nullable: true }
        github: { allOf: [{ $ref: '#/components/schemas/GithubConnection' }], nullable: true }
        analysis_status: { type: string, enum: [none, queued, running, succeeded, failed] }
        first_qa_status: { type: string, enum: [none, queued, running, succeeded, failed] }
        member_count: { type: integer }
        pending_invitation_count: { type: integer }
        issue_counts:
          type: object
          required: [needs_check, in_progress, fixed, needs_recheck, resolved]
          properties:
            needs_check: { type: integer }
            in_progress: { type: integer }
            fixed: { type: integer }
            needs_recheck: { type: integer }
            resolved: { type: integer }

    ProjectDetailResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/ProjectDetail'
        error: { type: object, nullable: true, example: null }

    FigmaConnectionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/FigmaConnection'
        error: { type: object, nullable: true, example: null }

    GithubConnectionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/GithubConnection'
        error: { type: object, nullable: true, example: null }

    FrameMapping:
      type: object
      required: [frame_id, frame_name, code_path, nodes]
      properties:
        frame_id: { type: string }
        frame_name: { type: string }
        code_path: { type: string, description: 그 화면을 그리는 파일(저장소 안 경로) }
        nodes:
          type: array
          items:
            type: object
            required: [node_id, node_name, code_path, code_symbol]
            properties:
              node_id: { type: string }
              node_name: { type: string }
              code_path: { type: string }
              code_symbol: { type: string, description: 그 블록을 그리는 컴포넌트·함수 이름 }

    DesignCodeMappingListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [run, commit_sha, items]
          properties:
            run:
              allOf: [{ $ref: '#/components/schemas/ProjectRun' }]
              nullable: true
              description: 매핑을 만든 비교 분석 실행(없으면 null)
            commit_sha: { type: string, nullable: true, description: 분석이 읽은 GitHub 커밋 }
            items:
              type: array
              items: { $ref: '#/components/schemas/FrameMapping' }
        error: { type: object, nullable: true, example: null }

    ProjectRunResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          allOf: [{ $ref: '#/components/schemas/ProjectRun' }]
          nullable: true
        error: { type: object, nullable: true, example: null }

    MemberResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Member'
        error: { type: object, nullable: true, example: null }

    ProjectResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Project'
        error: { type: object, nullable: true, example: null }

    InvitationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Invitation'
        error: { type: object, nullable: true, example: null }

    InvitationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Invitation'
        error: { type: object, nullable: true, example: null }

    InvitationPreviewResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            project_id: { type: string, description: "이미 참여한 사람을 그 프로젝트로 보내는 데 쓴다(시안 GST-02A). id만으로는 접근할 수 없다(AC12)" }
            project_name: { type: string }
            project_description: { type: string, nullable: true }
            invited_by_name: { type: string }
            email: { type: string }
            status: { type: string, enum: [pending, accepted, canceled, expired] }
            expires_at: { type: string, format: date-time }
        error: { type: object, nullable: true, example: null }

    MemberListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Member'
        error: { type: object, nullable: true, example: null }

    NotificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    FigmaSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            sync_id: { type: string }
            status: { type: string, enum: [queued] }
        error: { type: object, nullable: true, example: null }

    FigmaSyncStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, enum: [queued, running, done, failed] }
            frame_count: { type: integer }
            finished_at: { type: string, format: date-time, nullable: true }
        error: { type: object, nullable: true, example: null }

    FigmaFrameListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FigmaFrame'
        error: { type: object, nullable: true, example: null }

    StyleMismatchScanResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            scan_id: { type: string }
            status: { type: string, enum: [queued] }
        error: { type: object, nullable: true, example: null }

    StyleMismatchScanStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, enum: [queued, running, done, failed] }
            mismatch_count: { type: integer }
            finished_at: { type: string, format: date-time, nullable: true }
            error_message:
              type: string
              nullable: true
              description: failed일 때만 값이 있다. 사용자가 selector·URL을 고칠 수 있도록 보여 주는 이유 (500자 이하)
        error: { type: object, nullable: true, example: null }

    StyleMismatchListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StyleMismatch'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    StyleMismatchResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/StyleMismatch'
        error: { type: object, nullable: true, example: null }

    QAIssueResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/QAIssue'
        error: { type: object, nullable: true, example: null }

    QAIssueListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QAIssue'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    GithubSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            github_issue_url: { type: string }
            github_issue_number: { type: integer }
        error: { type: object, nullable: true, example: null }

    VerificationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Verification'
        error: { type: object, nullable: true, example: null }

    VerificationCreateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            verification:
              $ref: '#/components/schemas/Verification'
            issue_status: { type: string, enum: [resolved, needs_recheck] }
            repro_steps:
              type: array
              items: { type: string }
              description: 이슈에 처음 기록된 재현 절차 그대로 (AC5)
        error: { type: object, nullable: true, example: null }

    RecheckSuggestionResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [issue_id, suggestions, searched_count, dropped_count]
          properties:
            issue_id: { type: string }
            suggestions:
              type: array
              maxItems: 5
              description: 관련 높은 순(LLM이 낸 순서). 근거가 약하면 비어 있을 수 있다
              items:
                $ref: '#/components/schemas/RecheckSuggestion'
            searched_count:
              type: integer
              description: 검색해 LLM에 넘긴 문서 수(0~8). 0이면 LLM을 부르지 않았다
            dropped_count:
              type: integer
              description: 근거 id 검사(N16) 또는 대상 이슈와 같은 화면이라 버린 제안 수
        error: { type: object, nullable: true, example: null }

    RecheckSuggestion:
      type: object
      required: [screen, reason, evidence]
      properties:
        screen:
          type: string
          description: 같이 다시 볼 화면(근거 문서의 화면 이름에서 나온 자유 텍스트). 대상 이슈의 screen_location과 같은 값은 오지 않는다
        reason:
          type: string
          description: 근거 문서 내용에서 나온 이유(한국어)
        evidence:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [qa_issue, style_mismatch, verification] }
              id: { type: string, description: 그 type의 id. 모두 이번 요청의 검색 결과에 있던 문서다 }

    ParseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            context:
              $ref: '#/components/schemas/IssueReportContext'
            missing:
              type: array
              items: { type: string }
              description: 텍스트에 없어 되물어야 하는 항목 이름 (AC8)
        error: { type: object, nullable: true, example: null }

    VerificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Verification'
        error: { type: object, nullable: true, example: null }
