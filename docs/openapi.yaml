openapi: 3.0.3

info:
  title: QAting API
  description: >
    QA 이슈를 재현 정보와 함께 등록하고, 조치 완료를 등록자에게 알리고, 같은 재현 절차로 재검증해 닫는
    서비스의 API 명세. v0.2 — 무엇을 만드는가의 정본은 docs/SPEC.md이며, 이 파일은 SPEC 5절을 따른다.
    DB/인증 스택이 아직 미확정이라 계속 바뀔 수 있음.
  version: 0.2.0
  contact:
    name: 안캡잘부
    url: https://github.com/tjfakstn/ACJB

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 (backend/ Spring 서버)

tags:
  - name: Auth
    description: >-
      구글 소셜로그인(OAuth2). 구현/동작 중인 태그 — 나머지 태그(Project/Notification/Figma/StyleMismatch/
      QAIssue/Verification)는 아직 설계만 된 상태
  - name: Project
    description: 로그인한 사용자가 속한 프로젝트와 멤버 조회 (담당자 선택용). 프로젝트·멤버 등록 API는 v1에 없고 시드 데이터로 넣는다
  - name: Notification
    description: 내게 온 앱 내 알림 조회 (SPEC AC14). 이메일·Slack 등 외부 채널은 v2
  - name: Figma
    description: Figma 프레임/디자인 토큰 동기화
  - name: StyleMismatch
    description: Figma 기준값과 구현 값의 스타일 차이 — 사람 입력 경로와 자동 추출·비교(scan, v1 포함·웹·color/font_weight/radius 한정) 경로
  - name: QAIssue
    description: 재현 정보가 담긴 QA 이슈 등록·상태·알림 (MVP 핵심). GitHub 연동은 v1 비포함
  - name: Verification
    description: 수정 후 재검증 — 재현 절차 재사용 (MVP 핵심)

security:
  - SessionCookie: []
    CsrfHeader: []

paths:
  /projects:
    get:
      tags: [Project]
      summary: 내가 속한 프로젝트 목록 (SPEC AC15)
      description: >-
        로그인한 사용자가 멤버인 프로젝트만 반환한다. 속하지 않은 프로젝트는 존재 여부도 알려 주지 않는다.
        정렬은 name asc, id asc로 고정한다. 미인증이면 401.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{projectId}/members:
    get:
      tags: [Project]
      summary: 프로젝트 멤버 목록 (담당자 선택용, SPEC AC15)
      description: >-
        그 프로젝트의 멤버만 호출할 수 있다(미인증 401, 비멤버 403 — AC12). 정렬은 name asc, id asc로 고정한다.
        `assigned_to`·`reported_by`·`verified_by` 등 멤버를 가리키는 값은 모두 여기 나오는 `id`다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/notifications:
    get:
      tags: [Notification]
      summary: 내게 온 알림 목록 (SPEC AC14)
      description: >-
        요청자 본인이 받는 알림(to_member_id = 요청자)만 반환한다. 다른 멤버의 알림은 담지 않는다.
        정렬은 created_at desc, id desc로 고정한다. 읽음 처리·삭제는 v1에 없다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: event
          in: query
          schema:
            type: string
            enum: [issue_created, fixed, recheck_failed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login/google:
    get:
      tags: [Auth]
      summary: 구글 로그인 시작
      description: >-
        브라우저 전체 리다이렉트 전용 (fetch로 호출하지 말 것). `<a href>` 클릭 등으로 이동시키면
        구글 로그인 화면으로 리다이렉트됨. 로그인 성공 시 `app.oauth2.login-success-redirect`
        설정값(프론트 주소)으로 다시 리다이렉트됨.
      security: []
      responses:
        '302':
          description: accounts.google.com으로 리다이렉트

  /auth/callback/google:
    get:
      tags: [Auth]
      summary: 구글 OAuth 콜백 (구글이 호출, 직접 호출 금지)
      description: >-
        Google Cloud Console에 등록된 리디렉션 URI(`{baseUrl}/api/v1/auth/callback/google`)로
        구글이 인가 코드와 함께 호출하는 내부 엔드포인트. 우리 프론트/클라이언트가 직접 호출할 일 없음.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 로그인 성공 시 프론트 주소로, 실패 시 에러 페이지로 리다이렉트

  /auth/me:
    get:
      tags: [Auth]
      summary: 로그인 상태 확인
      description: 인증 여부와 무관하게 200으로 응답 (미인증이면 authenticated:false)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  name:
                    type: string
                  email:
                    type: string
                  picture:
                    type: string
              examples:
                authenticated:
                  value: { authenticated: true, name: 홍길동, email: hong@example.com, picture: 'https://...' }
                anonymous:
                  value: { authenticated: false }

  /auth/logout:
    get:
      tags: [Auth]
      summary: 로그아웃
      description: >-
        의도적으로 GET — 로그인 버튼과 동일하게 `<a href>` 링크만으로 동작하도록 함
        (POST로 바꾸려면 프론트에서 CSRF 토큰 처리 필요, 아직 TODO)
      security: []
      responses:
        '302':
          description: 세션 종료 후 '/' 로 리다이렉트

  /projects/{projectId}/figma/sync:
    post:
      tags: [Figma]
      summary: Figma 파일에서 프레임/디자인 토큰 동기화
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [figma_file_key]
              properties:
                figma_file_key:
                  type: string
                frame_ids:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: 없으면 전체 동기화
      responses:
        '202':
          description: 동기화 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/figma/sync/{syncId}:
    get:
      tags: [Figma]
      summary: 동기화 작업 상태 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: syncId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaSyncStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/figma/frames:
    get:
      tags: [Figma]
      summary: 동기화된 프레임 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaFrameListResponse'

  /projects/{projectId}/style-mismatches/scan:
    post:
      tags: [StyleMismatch]
      summary: Figma 프레임 vs 배포 화면 스타일 자동 비교 실행 (v1 포함, SPEC.md 4절)
      description: >-
        범위는 웹 화면의 단일 컴포넌트, color·font_weight·radius 3개 property로 한정한다. 한쪽 값 추출에 실패하면
        그 property는 저장하지 않는다(AC2). 동작 방식(2026-10-28 제안, 구현 전 확인 필요): 서버가 Figma REST API로
        `node_id`의 값을 읽고(토큰은 서버 환경변수 `FIGMA_ACCESS_TOKEN`), 헤드리스 브라우저로 `target_url`을 열어
        `selector`가 가리키는 요소의 getComputedStyle을 읽어 비교한다. `frame_id`는 figma/sync로 가져온 프레임이어야 한다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame_id, node_id, target_url, selector]
              properties:
                frame_id:
                  type: string
                  description: 비교 기준 FigmaFrame (figma/sync로 동기화된 프레임)
                node_id:
                  type: string
                  description: frame_id 안에서 비교할 컴포넌트의 Figma 노드 ID (예 84:759)
                target_url:
                  type: string
                  description: 비교 대상 Screen의 배포 URL
                selector:
                  type: string
                  description: target_url 화면에서 node_id와 짝지을 요소의 CSS selector
      responses:
        '202':
          description: 비교 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchScanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/style-mismatches/scans/{scanId}:
    get:
      tags: [StyleMismatch]
      summary: 비교 작업 상태 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchScanStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/style-mismatches:
    get:
      tags: [StyleMismatch]
      summary: 발견된 스타일 차이 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: frame_id
          in: query
          schema:
            type: string
        - name: property
          in: query
          schema:
            type: string
            enum: [color, font_weight, font_family, radius, shadow, spacing, text]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchListResponse'

  /projects/{projectId}/style-mismatches/{mismatchId}:
    get:
      tags: [StyleMismatch]
      summary: 스타일 차이 상세
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MismatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/style-mismatches/{mismatchId}/issues:
    post:
      tags: [QAIssue]
      summary: 스타일 차이(StyleMismatch)로부터 QA Issue 생성 (자동 경로)
      description: >-
        차이의 expected_value·actual_value가 이슈의 style_mismatch로 옮겨진다. 재현 정보는 요청에서 받는다(AC1).
        자동 경로 자체의 포함 여부는 스파이크(docs/spikes/) 결과로 정한다 — SPEC.md 4절.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MismatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screen_location, repro_steps, platform_scope]
              properties:
                description: { type: string }
                screen_location: { type: string }
                repro_steps:
                  type: array
                  items: { type: string }
                platform_scope: { type: string, enum: [common, aos, ios] }
                environment:
                  $ref: '#/components/schemas/Environment'
      responses:
        '201':
          description: Created (status = needs_check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/parse:
    post:
      tags: [QAIssue]
      summary: 자유서술 이슈 텍스트를 IssueReportContext로 파싱 (SPEC AC8)
      description: >-
        텍스트에 없는 화면·요소·환경 값은 지어내지 않고 비워 두며, 빠진 항목을 missing에 담아 되묻는다.
        프롬프트 정본은 src/qating/prompts/parse_query.md.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "아이콘 너무 커요" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/qa-issues:
    post:
      tags: [QAIssue]
      summary: QA Issue 등록 (SPEC AC1·AC2·AC3)
      description: >-
        재현 정보(screen_location, repro_steps, platform_scope)가 하나라도 비면 400과 빠진 항목 이름을 반환한다(AC1).
        style_mismatch는 expected_value와 actual_value가 둘 다 있어야 저장된다(AC2).
        등록되면 담당자에게 Notification(event: issue_created)이 생성된다(AC3).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, screen_location, repro_steps, platform_scope]
              properties:
                description: { type: string }
                screen_location: { type: string, description: 어느 화면의 어느 요소인지 }
                repro_steps:
                  type: array
                  items: { type: string }
                platform_scope: { type: string, enum: [common, aos, ios], description: 이슈 분류용(common = AOS·iOS 모두) }
                environment:
                  $ref: '#/components/schemas/Environment'
                screenshots:
                  type: array
                  items: { type: string, format: uri }
                figma_link: { type: string, nullable: true }
                style_mismatch:
                  $ref: '#/components/schemas/StyleMismatch'
                assigned_to: { type: string, nullable: true, description: 담당자의 멤버 id. 프로젝트 멤버가 아니면 400 }
      responses:
        '201':
          description: Created (status = needs_check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [QAIssue]
      summary: QA Issue 목록 조회 (status=fixed → 재확인 대기 이슈)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          schema:
            type: string
            enum: [needs_check, fixed, needs_recheck, resolved]
        - name: assigned_to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueListResponse'

  /projects/{projectId}/qa-issues/{issueId}:
    get:
      tags: [QAIssue]
      summary: QA Issue 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [QAIssue]
      summary: 상태·담당자 수정 (SPEC AC4·AC6)
      description: >-
        PATCH로 허용되는 상태 전이는 needs_check → fixed, needs_recheck → fixed 뿐이다(AC6).
        fixed → resolved / needs_recheck는 재검증 등록으로만 바뀐다. 그 밖의 전이는 409.
        fixed로 바뀌면 등록자에게 Notification(event: fixed)이 생성된다(AC4).
        status: fixed는 그 이슈의 assigned_to만 요청할 수 있다(그 외 403, AC13). 권한 검사가 전이 검사보다 먼저다.
        `assigned_to`는 `GET /projects/{projectId}/members`의 멤버 id다. 프로젝트 멤버가 아니면 400,
        null로 담당자를 비우는 요청도 400이다(담당자는 지정·변경만 가능). body에 status·assigned_to 외의 필드가 오면 400(N6).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [fixed]
                assigned_to:
                  type: string
                  description: 멤버 id. null 불가
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/qa-issues/{issueId}/github-sync:
    post:
      tags: [QAIssue]
      deprecated: true
      summary: GitHub Issue 생성 및 연동 — v1 비포함 (SPEC.md 4절, v2 후보)
      description: >-
        v1 범위에서 제외. 응답자들이 쓰는 이슈 트래커가 Jira·Notion·엑셀로 제각각이라(interviews.md 로그 2, 8, 11, 12)
        외부 트래커 연동은 v2에서 다시 판단한다. 설계 기록으로만 남겨 둔다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  example: tjfakstn/ACJB
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSyncResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/{issueId}/verifications:
    post:
      tags: [Verification]
      summary: 재검증 결과 등록 (SPEC AC5·AC7)
      description: >-
        상태가 fixed인 이슈에만 등록할 수 있다(그 외 409). pass면 이슈를 resolved로, fail이면 needs_recheck로 바꾸고
        status_history에 남긴다(AC7). 응답에 이슈의 최초 repro_steps를 그대로 담아 재입력 없이 쓰게 한다(AC5).
        그 이슈의 reported_by만 등록할 수 있다(그 외 403, AC13). fail이면 담당자에게 Notification(event: recheck_failed)이 생성된다(AC11).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [pass, fail]
                scope:
                  type: string
                  nullable: true
                  description: 재확인 범위(해당 화면만 / 관련 화면 전체)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCreateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Verification]
      summary: 해당 이슈의 재검증 이력 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationListResponse'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        구글 로그인(OAuth2) 성공 후 서버가 내려주는 세션 쿠키. 프론트는 fetch에 `credentials: 'include'`를 쓴다.
        로그인한 구글 이메일이 `Member`와 일치해야 프로젝트 API를 쓸 수 있다(AC12).
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >-
        상태를 바꾸는 요청(POST·PATCH)에 필요. 서버가 `XSRF-TOKEN` 쿠키로 내려주는 값을 이 헤더에 그대로 실어 보낸다.
        없거나 틀리면 403. GET은 필요 없다.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    MismatchId:
      name: mismatchId
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 로그인하지 않음 (SPEC AC12)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 프로젝트 멤버가 아니거나, 이 상태 변경을 할 권한이 없거나, CSRF 토큰이 없음 (SPEC AC12·AC13)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 허용되지 않은 상태 전이 (SPEC AC6)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- 공통 envelope ---
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/Error'

    # --- 데이터 모델 (이름·값은 docs/ontology.yaml 대표어를 따른다) ---
    QAIssue:
      type: object
      description: QA 중 발견되어 등록·전달되는 수정 요청 한 건 (docs/ontology.yaml QAIssue)
      required: [id, project_id, description, screen_location, repro_steps, platform_scope, status, reported_by, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        description: { type: string }
        screen_location: { type: string }
        repro_steps:
          type: array
          items: { type: string }
        platform_scope: { type: string, enum: [common, aos, ios] }
        environment:
          $ref: '#/components/schemas/Environment'
        screenshots:
          type: array
          items: { type: string, format: uri }
        figma_link: { type: string, nullable: true }
        style_mismatch:
          type: object
          allOf:
            - $ref: '#/components/schemas/StyleMismatch'
          nullable: true
        status:
          type: string
          enum: [needs_check, fixed, needs_recheck, resolved]
          default: needs_check
          description: 확인 필요 → 조치 완료 → (재검증 pass) 해결 완료 / (fail) 재확인 필요 → 조치 완료
        status_history:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [needs_check, fixed, needs_recheck, resolved] }
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
        assigned_to: { type: string, nullable: true, description: 담당자(고치는 사람)의 멤버 id }
        reported_by: { type: string, description: 등록자(등록한 사람)의 멤버 id. 로그인 사용자로 서버가 기록 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StyleMismatch:
      type: object
      description: Figma 기준값과 구현 값이 다른 스타일 차이 한 건. 두 값이 모두 있어야 저장된다(AC2)
      required: [property, expected_value, actual_value]
      properties:
        id: { type: string, readOnly: true }
        frame_id: { type: string, nullable: true, description: 기준이 된 FigmaFrame }
        screen: { type: string, nullable: true, description: 비교한 Screen(배포 화면) }
        property: { type: string, enum: [color, font_weight, font_family, radius, shadow, spacing, text] }
        expected_value: { type: string, description: Figma 기준값 }
        actual_value: { type: string, description: 구현 화면에 실제 적용된 값 }

    Environment:
      type: object
      description: 이슈가 발생·확인된 환경
      properties:
        platform: { type: string, enum: [aos, ios, web] }
        device: { type: string }
        browser: { type: string }
        deploy_stage: { type: string, enum: [local, staging, production] }

    IssueReportContext:
      type: object
      description: 자유서술 이슈 텍스트를 파싱한 구조화 결과 (정본 스키마는 src/qating/schemas/)
      properties:
        screen: { type: string, nullable: true }
        element: { type: string, nullable: true }
        symptom: { type: string, nullable: true }
        repro_steps:
          type: array
          items: { type: string }
        platform_scope: { type: string, enum: [common, aos, ios], nullable: true }

    Verification:
      type: object
      description: 수정 후 재확인 1회 (docs/ontology.yaml Verification)
      required: [id, qa_issue_id, result, verified_by, verified_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        result: { type: string, enum: [pass, fail] }
        scope: { type: string, nullable: true }
        verified_by: { type: string }
        verified_at: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    Member:
      type: object
      description: QA에 참여하는 팀원 (docs/ontology.yaml Member). 구글 로그인 이메일로 식별한다
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [designer, developer, planner] }

    Notification:
      type: object
      description: 앱 내 알림 한 건 (정본 스키마는 src/qating/schemas/Notification.schema.json)
      required: [id, qa_issue_id, event, to_member_id, created_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        event: { type: string, enum: [issue_created, fixed, recheck_failed] }
        channel: { type: string, example: in_app }
        to_member_id: { type: string }
        created_at: { type: string, format: date-time }

    FigmaFrame:
      type: object
      properties:
        frame_id: { type: string }
        name: { type: string }
        frame_url: { type: string }
        last_synced_at: { type: string, format: date-time }

    # --- 응답 envelope (성공 시 success:true 고정, data만 다름) ---
    ProjectListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'
        error: { type: object, nullable: true, example: null }

    MemberListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Member'
        error: { type: object, nullable: true, example: null }

    NotificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    FigmaSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            sync_id: { type: string }
            status: { type: string, enum: [queued] }
        error: { type: object, nullable: true, example: null }

    FigmaSyncStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, enum: [queued, running, done, failed] }
            frame_count: { type: integer }
            finished_at: { type: string, format: date-time, nullable: true }
        error: { type: object, nullable: true, example: null }

    FigmaFrameListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FigmaFrame'
        error: { type: object, nullable: true, example: null }

    StyleMismatchScanResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            scan_id: { type: string }
            status: { type: string, enum: [queued] }
        error: { type: object, nullable: true, example: null }

    StyleMismatchScanStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, enum: [queued, running, done, failed] }
            mismatch_count: { type: integer }
            finished_at: { type: string, format: date-time, nullable: true }
        error: { type: object, nullable: true, example: null }

    StyleMismatchListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StyleMismatch'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    StyleMismatchResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/StyleMismatch'
        error: { type: object, nullable: true, example: null }

    QAIssueResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/QAIssue'
        error: { type: object, nullable: true, example: null }

    QAIssueListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QAIssue'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    GithubSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            github_issue_url: { type: string }
            github_issue_number: { type: integer }
        error: { type: object, nullable: true, example: null }

    VerificationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/Verification'
        error: { type: object, nullable: true, example: null }

    VerificationCreateResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            verification:
              $ref: '#/components/schemas/Verification'
            issue_status: { type: string, enum: [resolved, needs_recheck] }
            repro_steps:
              type: array
              items: { type: string }
              description: 이슈에 처음 기록된 재현 절차 그대로 (AC5)
        error: { type: object, nullable: true, example: null }

    ParseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            context:
              $ref: '#/components/schemas/IssueReportContext'
            missing:
              type: array
              items: { type: string }
              description: 텍스트에 없어 되물어야 하는 항목 이름 (AC8)
        error: { type: object, nullable: true, example: null }

    VerificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Verification'
        error: { type: object, nullable: true, example: null }
