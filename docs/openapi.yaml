openapi: 3.0.3

info:
  title: QAting API
  description: >
    QA 이슈를 재현 정보와 함께 등록하고, 조치 완료를 등록자에게 알리고, 같은 재현 절차로 재검증해 닫는
    서비스의 API 명세. v0.2 — 무엇을 만드는가의 정본은 docs/SPEC.md이며, 이 파일은 SPEC 5절을 따른다.
    DB/인증 스택이 아직 미확정이라 계속 바뀔 수 있음.
  version: 0.5.2
  contact:
    name: 안캡잘부
    url: https://github.com/tjfakstn/ACJB

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 (backend/ Spring 서버)

tags:
  - name: Auth
    description: >-
      구글 소셜로그인(OAuth2). 구현/동작 중인 태그 — 나머지 태그(Project/Notification/Figma/StyleMismatch/
      QAIssue/Verification)는 아직 설계만 된 상태
  - name: Project
    description: >-
      프로젝트 생성·멤버 조회·멤버 제거 (SPEC AC15·AC16·AC19). 로그인한 사용자 누구나 프로젝트를 만들고 만든 사람이 소유자다.
      시드 데이터로 멤버를 넣던 방식은 폐기(2026-11-04)
  - name: Invitation
    description: >-
      구글 이메일 초대와 수락 (SPEC AC17·AC18). 초대 메일의 수락 링크에 토큰이 담기고, 같은 구글 계정으로 로그인해 수락해야 멤버가 된다.
      /invitations/** 는 로그인만 필요하다(아직 그 프로젝트 멤버가 아니므로 AC12 대상 아님)
  - name: Notification
    description: 내게 온 앱 내 알림 조회 (SPEC AC14). 이메일·Slack 등 외부 채널은 v2
  - name: Figma
    description: Figma 프레임/디자인 토큰 동기화
  - name: StyleMismatch
    description: Figma 기준값과 구현 값의 스타일 차이 — 사람 입력 경로와 자동 추출·비교(scan, v1 포함·웹·color/font_weight/radius 한정) 경로
  - name: QAIssue
    description: 재현 정보가 담긴 QA 이슈 등록·상태·알림 (MVP 핵심). GitHub 연동은 v1 비포함
  - name: Verification
    description: 수정 후 재검증 — 재현 절차 재사용 (MVP 핵심)

security:
  - SessionCookie: []
    CsrfHeader: []

paths:
  /projects:
    post:
      tags: [Project]
      summary: 프로젝트 만들기 (SPEC AC16)
      description: >-
        요청자가 소유자(owner)이자 역할 미지정(role null)의 첫 멤버가 된다 — 역할은 이후 멤버 역할 변경(AC24)으로 정한다(2026-11-07).
        name 규칙(2~40자, 허용 문자)이나 description(200자 이하)을 어기면 400이고 아무것도 만들지 않는다.
        처음 로그인한 구글 계정은 이때(또는 다른 첫 요청 때) Member로 만들어진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 40, description: '공백을 뺀 길이 2~40자, 한글·영문·숫자·공백·-·_' }
                description: { type: string, maxLength: 200, description: 선택. 작업공간·초대 미리보기·초대 메일에 보인다 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Project]
      summary: 내가 속한 프로젝트 목록 (SPEC AC15)
      description: >-
        로그인한 사용자가 멤버인 프로젝트만 반환한다. 속하지 않은 프로젝트는 존재 여부도 알려 주지 않는다.
        정렬은 name asc, id asc로 고정한다. 미인증이면 401.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{projectId}:
    get:
      tags: [Project]
      summary: 프로젝트 상세 — 작업공간 홈 (SPEC AC25)
      description: >-
        프로젝트 멤버만(AC12). 연결·비교 분석·첫 QA 상태와 멤버 수·대기 초대 수·상태별 이슈 수를 한 번에 돌려준다.
        issue_counts는 5개 상태를 모두 담는다(0 포함).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/connections/figma:
    put:
      tags: [Project]
      summary: Figma 페이지 연결 (SPEC AC21)
      description: >-
        소유자만(그 외 403). url은 Figma 앱의 페이지 [공유하기]에서 복사한 페이지 링크(figma.com/design/{key}/{이름}?node-id={페이지 id})만 받는다(2026-11-07).
        node-id가 없거나 페이지가 아니면(프레임·섹션) 400. 파일 이름과 페이지 id·이름을 저장하고 이후 분석은 이 페이지 안만 본다.
        서버 Figma 토큰으로 파일을 읽을 수 있는지 확인한 뒤에만 저장한다 — 보기 권한이 없으면 422 CONNECTION_FORBIDDEN,
        없는 파일·응답 지연이면 502 CONNECTION_FAILED, 서버 Figma 토큰이 없거나 만료·잘못됐으면 503 FIGMA_UNAVAILABLE이고(Figma는 만료 토큰도 403으로 주지만
        본문의 "Token expired"·"Invalid token"으로 구분해 사용자 권한 문제로 안내하지 않는다) 기존 연결은 그대로다.
        비교 분석이 성공한 뒤에는 바꿀 수 없다(409 NOT_READY).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
      responses:
        '200':
          description: 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ConnectionForbidden'
        '502':
          $ref: '#/components/responses/ConnectionFailed'

  /projects/{projectId}/connections/github:
    put:
      tags: [Project]
      summary: GitHub 공개 저장소 연결 (SPEC AC21)
      description: >-
        소유자만(그 외 403). url은 github.com/{owner}/{repo} 형식이어야 한다(400). 서버 토큰(없으면 익명)으로 저장소를 읽을 수 있는지
        확인한 뒤에만 저장한다 — GitHub가 404를 주면(비공개와 없는 저장소를 구분해 주지 않는다) 422 CONNECTION_FORBIDDEN,
        응답 지연·GitHub 서버 오류면 502 CONNECTION_FAILED.
        코드만 읽고 이슈·PR은 다루지 않는다(N13). 비교 분석이 성공한 뒤에는 바꿀 수 없다(409 NOT_READY).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
      responses:
        '200':
          description: 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubConnectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ConnectionForbidden'
        '502':
          $ref: '#/components/responses/ConnectionFailed'

  /projects/{projectId}/analysis:
    post:
      tags: [Project]
      summary: 비교 분석 시작 — Figma 노드 ↔ 코드 위치 매핑 (SPEC AC22)
      description: >-
        소유자만(403). Figma·GitHub가 둘 다 연결돼 있어야 하고, 실행 중이거나 이미 성공했으면 409 NOT_READY.
        실패하면 다시 시작할 수 있다. 이슈·StyleMismatch를 만들지 않는다(N16).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Project]
      summary: 최근 비교 분석 상태
      description: 프로젝트 멤버 누구나. 실행한 적이 없으면 data가 null이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'

  /projects/{projectId}/first-qa:
    post:
      tags: [Project]
      summary: 첫 QA 실행 — 차이를 이슈로 자동 저장 (SPEC AC23)
      description: >-
        소유자만(403). 비교 분석이 성공했고 첫 QA가 아직 성공하지 않았을 때만 실행한다(그 외 409 NOT_READY). 실패하면 다시 실행할 수 있다.
        매핑된 짝마다 Figma 노드 값과 코드 값을 비교해, 둘 다 실제로 확인된 차이만 이슈(source first_qa, status needs_check,
        reported_by=요청자, assigned_to 없음, platform_scope common)로 저장한다(N17). 실패한 실행은 이슈를 하나도 남기지 않는다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Project]
      summary: 최근 첫 QA 상태와 만든 이슈 수
      description: 프로젝트 멤버 누구나. 실행한 적이 없으면 data가 null이다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRunResponse'

  /projects/{projectId}/members:
    get:
      tags: [Project]
      summary: 프로젝트 멤버 목록 (담당자 선택용, SPEC AC15)
      description: >-
        그 프로젝트의 멤버만 호출할 수 있다(미인증 401, 비멤버 403 — AC12). 정렬은 name asc, id asc로 고정한다.
        `assigned_to`·`reported_by`·`verified_by` 등 멤버를 가리키는 값은 모두 여기 나오는 `id`다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/members/{memberId}:
    patch:
      tags: [Project]
      summary: 멤버 역할 변경 (SPEC AC24)
      description: >-
        소유자만(그 외 403). 소유자 본인 역할도 바꿀 수 있다. 그 프로젝트 멤버가 아니면 404, role이 정해진 값이 아니면 400.
        이슈·담당자·알림은 바꾸지 않는다(알림 종류 3개 고정 — N5).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [designer, frontend, backend, planner] }
      responses:
        '200':
          description: 바뀐 멤버
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Project]
      summary: 멤버 제거 (SPEC AC19)
      description: >-
        소유자만 할 수 있다(그 외 403). 소유자 자신은 제거할 수 없다(409). 제거된 멤버가 담당자인 미해결(resolved가 아닌) 이슈는
        assigned_to가 비워지고, 상태·status_history·알림·재검증 기록은 그대로 둔다(N15).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 제거됨
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/invitations:
    post:
      tags: [Invitation]
      summary: 구글 이메일로 초대 (SPEC AC17)
      description: >-
        프로젝트 멤버 누구나 초대할 수 있다. 7일 뒤 만료되는 pending 초대를 1건 만들고 그 이메일로 초대 메일을 1통 보낸다.
        이미 멤버인 이메일이면 409. 같은 이메일에 pending 초대가 있으면 새로 만들지 않고 그 초대의 만료를 지금부터 7일로 늘리고
        수락 링크 토큰을 새로 발급해 메일을 다시 보낸다(200, 이전 링크 무효 — 2026-11-07).
        메일 발송이 실패해도 초대는 남는다(초대받은 사람은 로그인 후 GET /invitations/mine으로 수락 가능).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '200':
          description: 대기 중 초대를 연장해 다시 보냄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Invitation]
      summary: 이 프로젝트의 대기 중인 초대 목록
      description: 프로젝트 멤버만(AC12). 정렬은 created_at desc, id desc로 고정한다. 토큰은 담지 않는다(N14).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'

  /projects/{projectId}/invitations/{invitationId}:
    delete:
      tags: [Invitation]
      summary: 초대 취소
      description: 초대한 사람 또는 소유자만(그 외 403). pending이 아니면 409.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 취소됨
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/invitations/{invitationId}/resend:
    post:
      tags: [Invitation]
      summary: 초대 재전송 — 만료 7일 연장 (SPEC AC17)
      description: >-
        프로젝트 멤버 누구나. pending 초대만(그 외 409 INVITATION_CLOSED). 새 초대를 만들지 않고 expires_at을 지금부터 7일로 늘리고,
        수락 링크 토큰을 새로 발급해 메일을 1통 보낸다(이전 링크 무효). 토큰은 응답에 담지 않는다(N14).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 연장된 초대
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invitations/mine:
    get:
      tags: [Invitation]
      summary: 내게 온 대기 중인 초대 (앱 안 초대함)
      description: 로그인한 구글 이메일로 온 pending·만료 전 초대만. 정렬 created_at desc, id desc. 수락은 각 항목의 id로 POST /invitations/mine/{invitationId}/accept.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invitations/mine/{invitationId}/accept:
    post:
      tags: [Invitation]
      summary: 앱 안 초대함에서 수락 (SPEC AC18)
      description: 메일 링크 수락과 같은 규칙이다 — 로그인 이메일이 초대 이메일과 같아야 하고(403), pending·만료 전이어야 한다(409).
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: 멤버가 됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invitations/{token}:
    get:
      tags: [Invitation]
      summary: 초대 미리보기 (메일의 수락 링크로 들어왔을 때)
      description: 로그인만 필요. 프로젝트 이름·초대한 사람·초대받은 이메일·상태·만료 시각을 보여준다. 없는 토큰은 404.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{token}/accept:
    post:
      tags: [Invitation]
      summary: 메일 링크로 수락 (SPEC AC18)
      description: >-
        로그인한 구글 이메일이 초대받은 이메일과 같지 않으면 403, 초대가 만료·취소·이미 수락됨이면 409, role이 정해진 값이 아니면 400.
        그 밖에는 고른 role의 멤버가 되고 초대는 accepted가 된다. 거부된 요청은 멤버를 만들지 않는다(N14).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: 멤버가 됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/notifications:
