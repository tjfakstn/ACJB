  /projects/{projectId}/style-mismatches/scan:
    post:
      tags: [StyleMismatch]
      summary: Figma 프레임 vs 배포 화면 스타일 자동 비교 실행 (v1 포함, SPEC.md 4절)
      description: >-
        범위는 웹 화면의 단일 컴포넌트, color·font_weight·radius 3개 property로 한정한다. 한쪽 값 추출에 실패하면
        그 property는 저장하지 않는다(AC2). 동작 방식(2026-11-05 구현으로 확정): 서버가 Figma REST API로
        `node_id`의 값을 읽고(토큰은 서버 환경변수 `FIGMA_ACCESS_TOKEN`), 헤드리스 Chromium(Playwright)으로 `target_url`을 열어
        `selector`가 가리키는 요소의 getComputedStyle을 읽어 비교한다. `frame_id`는 figma/sync로 가져온 프레임이어야 하고,
        `node_id`는 그 프레임 안에 있어야 한다.

        비교 규칙(스파이크 2026-09-28 기준): color 채널별 ±2, font_weight 정확히 일치, radius ±1px. 값이 다른 property만
        StyleMismatch로 저장한다(`#RRGGBB` / `600` / `8px` 형식). Figma 노드가 TEXT면 CSS 글자색(color)과, 그 외에는
        배경색(background-color)과 비교한다. 투명도·그라디언트·모서리마다 다른 반경처럼 값 하나로 정할 수 없는 경우는
        추출 실패로 보고 비교하지 않는다(N3). 비교할 수 있는 property가 하나도 없거나, selector가 요소 0개 또는 2개 이상에
        맞으면 scan은 failed가 되고 이유는 상태 조회의 `error_message`에 남는다.

        `target_url` 제한(2026-11-04 결정, 내부망 접근 차단): http/https만, 사용자 정보(user@host) 불가, 1000자 이하.
        사설·링크로컬(클라우드 메타데이터 169.254.169.254 포함)·CGNAT·멀티캐스트 등 내부 주소로 풀리는 호스트는 거부한다.
        localhost(루프백)는 서버 환경변수 `SCAN_ALLOW_LOCALHOST=true`일 때만 허용한다(로컬 개발용, 배포 서버에서는 끔).
        화면이 여는 모든 요청과 리다이렉트도 단계마다 같은 규칙으로 검사해 막는다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame_id, node_id, target_url, selector]
              properties:
                frame_id:
                  type: string
                  description: 비교 기준 FigmaFrame (figma/sync로 동기화된 프레임)
                node_id:
                  type: string
                  description: frame_id 안에서 비교할 컴포넌트의 Figma 노드 ID (예 84:759)
                target_url:
                  type: string
                  description: 비교 대상 Screen의 배포 URL
                selector:
                  type: string
                  description: target_url 화면에서 node_id와 짝지을 요소의 CSS selector
      responses:
        '202':
          description: 비교 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchScanResponse'
        '400':
          description: >-
            필수 항목 누락, frame_id·node_id 형식 오류, selector 500자 초과, 허용하지 않는 target_url,
            figma/sync로 동기화되지 않은 frame_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 서버에 Figma 토큰이 설정되지 않음 (error.code FIGMA_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/style-mismatches/scans/{scanId}:
    get:
      tags: [StyleMismatch]
      summary: 비교 작업 상태 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchScanStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/style-mismatches:
    get:
      tags: [StyleMismatch]
      summary: 발견된 스타일 차이 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: frame_id
          in: query
          schema:
            type: string
        - name: property
          in: query
          schema:
            type: string
            enum: [color, font_weight, font_family, radius, shadow, spacing, text]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchListResponse'

  /projects/{projectId}/style-mismatches/{mismatchId}:
    get:
      tags: [StyleMismatch]
      summary: 스타일 차이 상세
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MismatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleMismatchResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/style-mismatches/{mismatchId}/issues:
    post:
      tags: [QAIssue]
      summary: 스타일 차이(StyleMismatch)로부터 QA Issue 생성 (자동 경로)
      description: >-
        차이의 expected_value·actual_value가 이슈의 style_mismatch로 옮겨진다. 재현 정보는 요청에서 받는다(AC1).
        자동 경로 자체의 포함 여부는 스파이크(docs/spikes/) 결과로 정한다 — SPEC.md 4절.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/MismatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screen_location, repro_steps, platform_scope]
              properties:
                description: { type: string }
                screen_location: { type: string }
                repro_steps:
                  type: array
                  items: { type: string }
                platform_scope: { type: string, enum: [common, aos, ios] }
                environment:
                  $ref: '#/components/schemas/Environment'
      responses:
        '201':
          description: Created (status = needs_check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/parse:
    post:
      tags: [QAIssue]
      summary: 자유서술 이슈 텍스트를 IssueReportContext로 파싱 (SPEC AC8)
      description: >-
        텍스트에 없는 화면·요소·환경 값은 지어내지 않고 비워 두며, 빠진 항목을 missing에 담아 되묻는다.
        프롬프트 정본은 src/qating/prompts/parse_query.md.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "아이콘 너무 커요" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/qa-issues:
    post:
      tags: [QAIssue]
      summary: QA Issue 등록 (SPEC AC1·AC2·AC3)
      description: >-
        재현 정보(screen_location, repro_steps, platform_scope)가 하나라도 비면 400과 빠진 항목 이름을 반환한다(AC1).
        style_mismatch는 expected_value와 actual_value가 둘 다 있어야 저장된다(AC2).
        등록되면 담당자에게 Notification(event: issue_created)이 생성된다(AC3).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, screen_location, repro_steps, platform_scope]
              properties:
                description: { type: string }
                screen_location: { type: string, description: 어느 화면의 어느 요소인지 }
                repro_steps:
                  type: array
                  items: { type: string }
                platform_scope: { type: string, enum: [common, aos, ios], description: 이슈 분류용(common = AOS·iOS 모두) }
                environment:
                  $ref: '#/components/schemas/Environment'
                screenshots:
                  type: array
                  items: { type: string, format: uri }
                figma_link: { type: string, nullable: true }
                style_mismatch:
                  $ref: '#/components/schemas/StyleMismatch'
                assigned_to: { type: string, nullable: true, description: 담당자의 멤버 id. 프로젝트 멤버가 아니면 400 }
      responses:
        '201':
          description: Created (status = needs_check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [QAIssue]
      summary: QA Issue 목록 조회 (status=fixed → 재확인 대기 이슈, source=first_qa → 첫 QA 결과)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          schema:
            type: string
            enum: [needs_check, in_progress, fixed, needs_recheck, resolved]
        - name: source
          in: query
          schema:
            type: string
            enum: [manual, first_qa]
        - name: assigned_to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueListResponse'

  /projects/{projectId}/qa-issues/{issueId}:
    get:
      tags: [QAIssue]
      summary: QA Issue 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [QAIssue]
      summary: 상태·담당자 수정 (SPEC AC4·AC6)
      description: >-
        PATCH로 허용되는 상태 전이는 needs_check·needs_recheck → in_progress, in_progress → fixed, needs_check·needs_recheck → fixed 뿐이다(AC6, in_progress 2026-11-07).
        fixed → resolved / needs_recheck는 재검증 등록으로만 바뀐다. 그 밖의 전이는 409.
        fixed로 바뀌면 등록자에게 Notification(event: fixed)이 생성된다(AC4).
        status(in_progress·fixed)는 그 이슈의 assigned_to만 요청할 수 있다(그 외 403, AC13). in_progress는 알림을 만들지 않는다. 권한 검사가 전이 검사보다 먼저다.
        `assigned_to`는 `GET /projects/{projectId}/members`의 멤버 id다. 프로젝트 멤버가 아니면 400,
        null로 담당자를 비우는 요청도 400이다(담당자는 지정·변경만 가능). body에 status·assigned_to 외의 필드가 오면 400(N6).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [in_progress, fixed]
                assigned_to:
                  type: string
                  description: 멤버 id. null 불가
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/qa-issues/{issueId}/github-sync:
    post:
      tags: [QAIssue]
      deprecated: true
      summary: GitHub Issue 생성 및 연동 — v1 비포함 (SPEC.md 4절, v2 후보)
      description: >-
        v1 범위에서 제외. 응답자들이 쓰는 이슈 트래커가 Jira·Notion·엑셀로 제각각이라(interviews.md 로그 2, 8, 11, 12)
        외부 트래커 연동은 v2에서 다시 판단한다. 설계 기록으로만 남겨 둔다.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  example: tjfakstn/ACJB
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSyncResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/{issueId}/verifications:
    post:
      tags: [Verification]
      summary: 재검증 결과 등록 (SPEC AC5·AC7)
      description: >-
        상태가 fixed인 이슈에만 등록할 수 있다(그 외 409). pass면 이슈를 resolved로, fail이면 needs_recheck로 바꾸고
        status_history에 남긴다(AC7). 응답에 이슈의 최초 repro_steps를 그대로 담아 재입력 없이 쓰게 한다(AC5).
        그 이슈의 reported_by만 등록할 수 있다. reported_by가 더 이상 프로젝트 멤버가 아니면 프로젝트 소유자가 대신 등록한다(그 외 403, AC13, 2026-11-05). fail이면 담당자에게 Notification(event: recheck_failed)이 생성된다(AC11).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [pass, fail]
                scope:
                  type: string
                  nullable: true
                  description: 재확인 범위(해당 화면만 / 관련 화면 전체)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCreateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Verification]
      summary: 해당 이슈의 재검증 이력 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationListResponse'

  /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions:
    post:
      tags: [Verification]
      summary: 재검증 범위 제안 (SPEC AC20, 2026-11-06)
      description: >-
        fixed 이슈를 재검증하기 전에, 같은 프로젝트의 이슈·스타일 차이·fail 재검증 기록 중 그 이슈와 의미가 가까운 문서를
        임베딩(Voyage AI)으로 최대 8개 검색해 LLM(Claude)에 주고, 같이 다시 볼 화면을 최대 5개 근거와 함께 돌려준다.
        재검증 등록 권한자(AC13 — 등록자, 등록자가 제거됐으면 소유자)만 요청할 수 있고(그 외 403), fixed가 아니면 409
        INVALID_TRANSITION이다. 403·404·409일 때는 외부 호출을 하지 않는다. evidence가 비었거나 하나라도 이번 검색 결과에
        없던 id를 단 제안은 서버가 버리고 dropped_count에 센다(N16). 검색 결과가 0건이면 LLM을 부르지 않고 빈 suggestions를
        돌려준다. 다른 프로젝트 문서는 검색하지 않는다. 결과는 저장하지 않으며, 이슈·StyleMismatch·Verification·알림을
        만들거나 바꾸지 않는다. 외부 유료 호출을 일으키고 결과가 매번 달라질 수 있어 GET이 아니라 POST다. 본문은 없다.
        설계 근거 docs/design-recheck-suggestions.md.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecheckSuggestionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: >-
            임베딩·LLM 키가 없거나 호출 실패, 또는 LLM 응답이 스키마를 벗어남 (error.code SUGGESTION_FAILED).
            일부 결과를 돌려주지 않는다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        구글 로그인(OAuth2) 성공 후 서버가 내려주는 세션 쿠키. 프론트는 fetch에 `credentials: 'include'`를 쓴다.
        로그인한 구글 이메일이 `Member`와 일치해야 프로젝트 API를 쓸 수 있다(AC12).
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >-
        상태를 바꾸는 요청(POST·PATCH)에 필요. 서버가 `XSRF-TOKEN` 쿠키로 내려주는 값을 이 헤더에 그대로 실어 보낸다.
        없거나 틀리면 403. GET은 필요 없다.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    MismatchId:
      name: mismatchId
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 로그인하지 않음 (SPEC AC12)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 프로젝트 멤버가 아니거나, 이 상태 변경을 할 권한이 없거나, CSRF 토큰이 없음 (SPEC AC12·AC13)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConnectionForbidden:
      description: 연결하려는 Figma 파일·GitHub 저장소에 접근 권한이 없음 (SPEC AC21, CONNECTION_FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConnectionFailed:
      description: 연결 확인 실패 — 없는 Figma 파일, 응답 지연, 외부 서버 오류 (SPEC AC21, CONNECTION_FAILED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 허용되지 않은 상태 전이(AC6) 또는 지금 할 수 없는 요청(NOT_READY 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- 공통 envelope ---
    Error:
      type: object
      properties:
        code:
          type: string
          description: >-
            서비스가 정한 오류 코드(2026-11-05 확정, 11-06 1개·11-07 3개 추가 — 16개) — UNAUTHORIZED(401), FORBIDDEN(403), NOT_FOUND(404),
            VALIDATION_FAILED(400), INVALID_TRANSITION(409, AC6), CONCURRENT_UPDATE(409, 동시 요청 — 다시 시도),
            ALREADY_MEMBER(409), INVITATION_CLOSED(409, 만료·취소·이미 수락된 초대), OWNER_NOT_REMOVABLE(409),
            PARSE_FAILED(502, parse LLM 실패·스키마 위반), SUGGESTION_FAILED(502, 재검증 범위 제안의 임베딩·LLM 실패·스키마 위반, 2026-11-06 추가), FIGMA_UNAVAILABLE(503, 서버에 Figma 토큰 미설정),
            CONNECTION_FORBIDDEN(422, Figma 파일 보기 권한 없음·GitHub 404(비공개·없는 저장소) — AC21), CONNECTION_FAILED(502, 없는 Figma 파일·응답 지연·외부 서버 오류 — AC21),
            NOT_READY(409, 연결·분석 전 실행, 실행 중 중복, 이미 성공한 첫 QA·분석, 분석 후 링크 변경 — AC21~AC23), INTERNAL_ERROR(500). 프론트는 이 값으로 분기한다. 요청이 컨트롤러에 닿기 전 프레임워크 단계에서 거부되면
            HTTP 상태 이름이 온다(예 METHOD_NOT_ALLOWED) — 그래서 enum으로 막지 않는다.
          example: VALIDATION_FAILED
        message:
          type: string
          description: 사용자에게 보여 줄 수 있는 한국어 설명. 내부 오류 상세는 담지 않는다

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/Error'

    # --- 데이터 모델 (이름·값은 docs/ontology.yaml 대표어를 따른다) ---
    QAIssue:
      type: object
      description: QA 중 발견되어 등록·전달되는 수정 요청 한 건 (docs/ontology.yaml QAIssue)
      required: [id, project_id, description, screen_location, repro_steps, platform_scope, status, reported_by, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        description: { type: string }
        screen_location: { type: string }
        repro_steps:
          type: array
          items: { type: string }
        platform_scope: { type: string, enum: [common, aos, ios] }
        environment:
          $ref: '#/components/schemas/Environment'
        screenshots:
          type: array
          items: { type: string, format: uri }
        figma_link: { type: string, nullable: true }
        style_mismatch:
          type: object
          allOf:
            - $ref: '#/components/schemas/StyleMismatch'
          nullable: true
        status:
          type: string
          enum: [needs_check, in_progress, fixed, needs_recheck, resolved]
          default: needs_check
          description: 확인 필요 → (수정 중, 건너뛸 수 있음) → 조치 완료 → (재검증 pass) 해결 완료 / (fail) 재확인 필요 → 수정 중·조치 완료
        source:
          type: string
          enum: [manual, first_qa]
          default: manual
          description: manual=사람이 등록, first_qa=첫 QA가 근거로 자동 저장(AC23)
        status_history:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [needs_check, in_progress, fixed, needs_recheck, resolved] }
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
        assigned_to: { type: string, nullable: true, description: 담당자(고치는 사람)의 멤버 id }
        reported_by: { type: string, description: 등록자(등록한 사람)의 멤버 id. 로그인 사용자로 서버가 기록 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StyleMismatch:
      type: object
      description: Figma 기준값과 구현 값이 다른 스타일 차이 한 건. 두 값이 모두 있어야 저장된다(AC2)
      required: [property, expected_value, actual_value]
      properties:
        id: { type: string, readOnly: true }
        frame_id: { type: string, nullable: true, description: 기준이 된 FigmaFrame }
        screen: { type: string, nullable: true, description: 비교한 Screen(배포 화면) }
        property: { type: string, enum: [color, font_weight, font_family, radius, shadow, spacing, text] }
        expected_value: { type: string, description: Figma 기준값 }
        actual_value: { type: string, description: 구현 화면에 실제 적용된 값 }

    Environment:
      type: object
      description: 이슈가 발생·확인된 환경
      properties:
        platform: { type: string, enum: [aos, ios, web] }
        device: { type: string }
        browser: { type: string }
        deploy_stage: { type: string, enum: [local, staging, production] }

    IssueReportContext:
      type: object
      description: 자유서술 이슈 텍스트를 파싱한 구조화 결과 (정본 스키마는 src/qating/schemas/)
      properties:
        screen: { type: string, nullable: true }
        element: { type: string, nullable: true }
        symptom: { type: string, nullable: true }
        repro_steps:
          type: array
          items: { type: string }
        platform_scope: { type: string, enum: [common, aos, ios], nullable: true }

    Verification:
      type: object
      description: 수정 후 재확인 1회 (docs/ontology.yaml Verification)
      required: [id, qa_issue_id, result, verified_by, verified_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        result: { type: string, enum: [pass, fail] }
        scope: { type: string, nullable: true }
        verified_by: { type: string }
        verified_at: { type: string, format: date-time }

    Project:
      type: object
      required: [id, name, owner_id]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        owner_id: { type: string, description: 소유자의 멤버 id (멤버 제거 버튼을 보여줄지 판단용) }
        created_at: { type: string, format: date-time, description: 만든 시각(시안 PRJ-04 생성일) }

    ProjectSummary:
      type: object
      description: 프로젝트 목록 카드(시안 PRJ-01, SPEC AC15). issue_count=QA 결과 n건, open_issue_count=FAIL n건(resolved가 아닌 이슈)
      required: [id, name, owner_id, figma_connected, github_connected, analysis_status, issue_count, open_issue_count, member_count, members_preview]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        owner_id: { type: string }
        figma_connected: { type: boolean }
        github_connected: { type: boolean }
        analysis_status: { type: string, enum: [none, queued, running, succeeded, failed] }
        last_analyzed_at: { type: string, format: date-time, nullable: true, description: 마지막으로 성공한 비교 분석의 끝난 시각 }
        issue_count: { type: integer }
        open_issue_count: { type: integer }
        member_count: { type: integer }
        members_preview:
          type: array
          maxItems: 3
          description: 이름순 앞 3명
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    Invitation:
      type: object
      description: 프로젝트 초대 한 건. 토큰은 담지 않는다(초대 메일의 수락 링크에만 있다, N14)
      required: [id, project_id, project_name, email, status, invited_by, expires_at, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, accepted, canceled, expired] }
        invited_by: { type: string, description: 초대한 멤버 id }
        invited_by_name: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AcceptInvitationRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [designer, frontend, backend, planner], description: 이 프로젝트에서 내 역할 }

    Member:
      type: object
      description: >-
        QA에 참여하는 팀원 (docs/ontology.yaml Member). 구글 로그인 이메일로 식별한다.
        role은 이 프로젝트에서의 역할이다(프로젝트마다 다를 수 있음, 2026-11-04)
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [designer, frontend, backend, planner], nullable: true, description: 'null=미지정(만든 사람은 역할 없이 시작, 2026-11-07)' }

    Notification:
      type: object
      description: 앱 내 알림 한 건 (정본 스키마는 src/qating/schemas/Notification.schema.json)
      required: [id, qa_issue_id, event, to_member_id, created_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        event: { type: string, enum: [issue_created, fixed, recheck_failed] }
        channel: { type: string, example: in_app }
        to_member_id: { type: string }
        created_at: { type: string, format: date-time }

    FigmaFrame:
      type: object
      properties:
        frame_id: { type: string }
        name: { type: string }
        frame_url: { type: string }
        last_synced_at: { type: string, format: date-time }

    # --- 응답 envelope (성공 시 success:true 고정, data만 다름) ---
    ProjectListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProjectSummary'
        error: { type: object, nullable: true, example: null }

    ConnectRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 500 }

    FigmaConnection:
      type: object
      required: [url, file_key, file_name, page_id, page_name, connected_at]
      properties:
        url: { type: string }
        file_key: { type: string }
        file_name: { type: string }
        page_id: { type: string, description: '분석할 페이지 노드 id(예 424:2)' }
        page_name: { type: string }
        connected_at: { type: string, format: date-time }

    GithubConnection:
      type: object
      required: [url, repo, default_branch, connected_at]
      properties:
        url: { type: string }
        repo: { type: string, description: owner/repo }
        default_branch: { type: string }
        connected_at: { type: string, format: date-time }

    ProjectRun:
      type: object
      required: [id, kind, status, created_count, dropped_count, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [analysis, first_qa] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        created_count: { type: integer, description: analysis는 매핑 수, first_qa는 만든 이슈 수 }
        dropped_count: { type: integer, description: 근거가 모자라 버린 수(N17) }
        error_message: { type: string, nullable: true, description: 사용자에게 보여 줄 실패 사유 }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    ProjectDetail:
      type: object
      required: [id, name, owner_id, my_role, analysis_status, first_qa_status, member_count, pending_invitation_count, issue_counts]
      properties:
        id: { type: string }
        name: { type: string }
        owner_id: { type: string }
        description: { type: string, nullable: true }
        my_role: { type: string, enum: [designer, frontend, backend, planner], nullable: true, description: null=미지정 }
        figma: { allOf: [{ $ref: '#/components/schemas/FigmaConnection' }], nullable: true }
        github: { allOf: [{ $ref: '#/components/schemas/GithubConnection' }], nullable: true }
        analysis_status: { type: string, enum: [none, queued, running, succeeded, failed] }
        first_qa_status: { type: string, enum: [none, queued, running, succeeded, failed] }
        member_count: { type: integer }
        pending_invitation_count: { type: integer }
        issue_counts:
          type: object
          required: [needs_check, in_progress, fixed, needs_recheck, resolved]
