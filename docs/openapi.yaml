openapi: 3.0.3

info:
  title: QAting API
  description: >
    Figma 디자인과 실제 구현의 차이를 자동으로 검증하고, QA 이슈를 구조화해 GitHub로 연결하는
    서비스의 API 명세. 초안 v0.1 — docs/api_spec.md의 기계가 읽을 수 있는 버전.
    DB/인증 스택이 아직 미확정이라 계속 바뀔 수 있음.
  version: 0.1.0
  contact:
    name: 안캡잘부
    url: https://github.com/tjfakstn/ACJB

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 (backend/ Spring 서버)

tags:
  - name: Figma
    description: Figma 프레임/디자인 토큰 동기화
  - name: DesignDiff
    description: Figma 디자인과 실제 구현 대조 (MVP 핵심)
  - name: QAIssue
    description: 구조화된 QA 이슈 관리 및 GitHub 연동 (MVP 핵심)
  - name: Verification
    description: 수정 후 재검증 (P1)

security:
  - ApiKeyAuth: []

paths:
  /projects/{projectId}/figma/sync:
    post:
      tags: [Figma]
      summary: Figma 파일에서 프레임/디자인 토큰 동기화
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [figma_file_key]
              properties:
                figma_file_key:
                  type: string
                frame_ids:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: 없으면 전체 동기화
      responses:
        '202':
          description: 동기화 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/figma/sync/{syncId}:
    get:
      tags: [Figma]
      summary: 동기화 작업 상태 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: syncId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaSyncStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/figma/frames:
    get:
      tags: [Figma]
      summary: 동기화된 프레임 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaFrameListResponse'

  /projects/{projectId}/design-diffs/scan:
    post:
      tags: [DesignDiff]
      summary: 특정 프레임 vs 실제 배포 URL 비교 스캔 실행
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame_id, target_url]
              properties:
                frame_id:
                  type: string
                target_url:
                  type: string
                target_selector:
                  type: string
                  nullable: true
      responses:
        '202':
          description: 스캔 작업이 큐에 들어감 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDiffScanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{projectId}/design-diffs/scans/{scanId}:
    get:
      tags: [DesignDiff]
      summary: 스캔 상태 및 결과 요약 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: scanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDiffScanStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/design-diffs:
    get:
      tags: [DesignDiff]
      summary: 발견된 Design Diff 목록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: frame_id
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, major, minor]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, ignored, resolved]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDiffListResponse'

  /projects/{projectId}/design-diffs/{diffId}:
    get:
      tags: [DesignDiff]
      summary: 단일 Diff 상세 (스크린샷 before/after 포함)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DiffId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDiffResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [DesignDiff]
      summary: 상태 변경 (예 — 의도된 차이라서 ignored 처리)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DiffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, ignored, resolved]
                note:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDiffResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/design-diffs/{diffId}/issues:
    post:
      tags: [QAIssue]
      summary: 발견된 Diff로부터 QA Issue 생성 (자동 경로)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DiffId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  nullable: true
                  description: 없으면 diff 정보로 자동 생성
                priority:
                  type: string
                  enum: [high, medium, low]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues:
    post:
      tags: [QAIssue]
      summary: 수동 QA Issue 생성 (버그/기능요청 등 Diff와 무관한 이슈)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, priority]
              properties:
                type:
                  type: string
                  enum: [bug, design_mismatch, feature]
                title:
                  type: string
                description:
                  type: string
                repro_steps:
                  type: array
                  items:
                    type: string
                environment:
                  type: object
                  properties:
                    device:
                      type: string
                    browser:
                      type: string
                    url:
                      type: string
                screenshots:
                  type: array
                  items:
                    type: string
                    format: uri
                priority:
                  type: string
                  enum: [high, medium, low]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [QAIssue]
      summary: QA Issue 목록 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed, wontfix]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, medium, low]
        - name: type
          in: query
          schema:
            type: string
            enum: [bug, design_mismatch, feature]
        - name: assignee
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueListResponse'

  /projects/{projectId}/qa-issues/{issueId}:
    get:
      tags: [QAIssue]
      summary: QA Issue 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [QAIssue]
      summary: 상태/우선순위/담당자 수정
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved, closed, wontfix]
                priority:
                  type: string
                  enum: [high, medium, low]
                assignee:
                  type: string
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAIssueResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/{issueId}/github-sync:
    post:
      tags: [QAIssue]
      summary: GitHub Issue 생성 및 연동
      description: '.github/ISSUE_TEMPLATE/ 형식에 맞춰 본문 자동 구성'
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  example: tjfakstn/ACJB
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSyncResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/qa-issues/{issueId}/verifications:
    post:
      tags: [Verification]
      summary: 수정 완료 후 재검증 결과 등록
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [pass, fail]
                evidence_url:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
      responses:
        '201':
          description: >-
            Created. result:pass일 때 연결된 QAIssue를 자동으로 resolved 처리할지는 TODO(정책 미정)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Verification]
      summary: 해당 이슈의 재검증 이력 조회
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationListResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        TODO — DB/Auth 스택 미확정. 초안 단계 가정일 뿐이며 실제로는 구글 로그인(OAuth2, backend/
        참고) 세션 쿠키 방식으로 바뀔 가능성이 높음.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    DiffId:
      name: diffId
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- 공통 envelope ---
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: object
          nullable: true
          example: null
        error:
          $ref: '#/components/schemas/Error'

    # --- 데이터 모델 (src/qating/schemas/*.schema.json과 동일) ---
    DesignDiff:
      type: object
      description: Figma 프레임과 실제 배포 화면을 대조해 발견된 스타일/레이아웃 차이
      required: [id, project_id, frame_id, diff_type, property, expected_value, actual_value, severity, status, detected_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        scan_id: { type: string }
        frame_id: { type: string, description: Figma 프레임/노드 id }
        frame_name: { type: string }
        target_url: { type: string }
        diff_type:
          type: string
          enum: [color, typography, spacing, radius, shadow, layout, text_content, other]
        property: { type: string, description: '예: background-color, font-weight' }
        expected_value: { type: string, description: Figma 기준값 }
        actual_value: { type: string, description: 실제 구현 값 }
        severity: { type: string, enum: [critical, major, minor] }
        screenshot_before_url: { type: string, description: Figma 캡처 }
        screenshot_after_url: { type: string, description: 실제 화면 캡처 }
        status: { type: string, enum: [open, ignored, resolved], default: open }
        detected_by: { type: string, enum: [auto, manual], default: auto }
        detected_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    QAIssue:
      type: object
      description: 구조화된 QA 이슈 — Design Diff에서 자동 생성되거나 수동으로 등록됨
      required: [id, project_id, type, title, priority, status, reporter, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        design_diff_id:
          type: string
          nullable: true
          description: 연결된 Design Diff. 수동 등록이면 null
        type: { type: string, enum: [bug, design_mismatch, feature] }
        title: { type: string }
        description: { type: string }
        repro_steps:
          type: array
          items: { type: string }
        environment:
          type: object
          properties:
            device: { type: string }
            browser: { type: string }
            url: { type: string }
        screenshots:
          type: array
          items: { type: string, format: uri }
        priority: { type: string, enum: [high, medium, low] }
        status:
          type: string
          enum: [open, in_progress, resolved, closed, wontfix]
          default: open
        assignee: { type: string, nullable: true }
        reporter: { type: string }
        github_issue_url: { type: string, nullable: true }
        github_issue_number: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VerificationResult:
      type: object
      description: QA Issue 수정 후 재검증 결과
      required: [id, qa_issue_id, result, verified_by, verified_at]
      properties:
        id: { type: string }
        qa_issue_id: { type: string }
        result: { type: string, enum: [pass, fail] }
        verified_by: { type: string, description: 재검증 수행자 (사람 또는 AI) }
        verified_at: { type: string, format: date-time }
        evidence_url: { type: string, nullable: true, description: 재검증 스크린샷/녹화 등 }
        notes: { type: string, nullable: true }

    FigmaFrame:
      type: object
      properties:
        frame_id: { type: string }
        name: { type: string }
        figma_node_url: { type: string }
        last_synced_at: { type: string, format: date-time }

    # --- 응답 envelope (성공 시 success:true 고정, data만 다름) ---
    FigmaSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            sync_id: { type: string }
            status: { type: string, enum: [queued] }
        error: { type: object, nullable: true, example: null }

    FigmaSyncStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, enum: [queued, running, done, failed] }
            frame_count: { type: integer }
            finished_at: { type: string, format: date-time, nullable: true }
        error: { type: object, nullable: true, example: null }

    FigmaFrameListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FigmaFrame'
        error: { type: object, nullable: true, example: null }

    DesignDiffScanResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            scan_id: { type: string }
            status: { type: string, enum: [queued] }
        error: { type: object, nullable: true, example: null }

    DesignDiffScanStatusResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, enum: [queued, running, done, failed] }
            diff_count: { type: integer }
            finished_at: { type: string, format: date-time, nullable: true }
        error: { type: object, nullable: true, example: null }

    DesignDiffListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DesignDiff'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    DesignDiffResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/DesignDiff'
        error: { type: object, nullable: true, example: null }

    QAIssueResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/QAIssue'
        error: { type: object, nullable: true, example: null }

    QAIssueListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QAIssue'
            total: { type: integer }
        error: { type: object, nullable: true, example: null }

    GithubSyncResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            github_issue_url: { type: string }
            github_issue_number: { type: integer }
        error: { type: object, nullable: true, example: null }

    VerificationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/VerificationResult'
        error: { type: object, nullable: true, example: null }

    VerificationListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VerificationResult'
        error: { type: object, nullable: true, example: null }
