            enum: [issue_created, fixed, recheck_failed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login/google:
    get:
      tags: [Auth]
      summary: 구글 로그인 시작
      description: >-
        브라우저 전체 리다이렉트 전용 (fetch로 호출하지 말 것). `<a href>` 클릭 등으로 이동시키면
        구글 로그인 화면으로 리다이렉트됨. 로그인 성공 시 `app.oauth2.login-success-redirect`
        설정값(프론트 주소)으로 다시 리다이렉트됨.
      security: []
      responses:
        '302':
          description: accounts.google.com으로 리다이렉트

  /auth/callback/google:
    get:
      tags: [Auth]
      summary: 구글 OAuth 콜백 (구글이 호출, 직접 호출 금지)
      description: >-
        Google Cloud Console에 등록된 리디렉션 URI(`{baseUrl}/api/v1/auth/callback/google`)로
        구글이 인가 코드와 함께 호출하는 내부 엔드포인트. 우리 프론트/클라이언트가 직접 호출할 일 없음.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 로그인 성공 시 프론트 주소로, 실패 시 에러 페이지로 리다이렉트

  /auth/me:
    get:
      tags: [Auth]
      summary: 로그인 상태 확인
      description: >-
        인증 여부와 무관하게 200으로 응답 (미인증이면 authenticated:false). 로그인했으면 `id`는 내 멤버 id로,
        `owner_id`·`reported_by`·`assigned_to` 등과 비교해 내 것인지 판단하는 데 쓴다(2026-11-05 추가).
        처음 로그인한 구글 계정은 이 호출에서 Member가 만들어진다(AC16). name·email은 Member 값, picture는 구글 프로필 값이다.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean
                  id:
                    type: string
                    description: 내 멤버 id (로그인했을 때만)
                  name:
                    type: string
                  email:
                    type: string
                  picture:
                    type: string
                    nullable: true
              examples:
                authenticated:
                  value: { authenticated: true, id: '12', name: 홍길동, email: hong@example.com, picture: 'https://...' }
                anonymous:
                  value: { authenticated: false }

  /auth/logout:
    get:
      tags: [Auth]
      summary: 로그아웃
      description: >-
        의도적으로 GET — 로그인 버튼과 동일하게 `<a href>` 링크만으로 동작하도록 함
        (POST로 바꾸려면 프론트에서 CSRF 토큰 처리 필요, 아직 TODO)
      security: []
      responses:
        '302':
          description: 세션 종료 후 '/' 로 리다이렉트

