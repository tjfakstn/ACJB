# 골든 케이스 (데이터)
# 구현 전 단계라 입출력 "형태"만 먼저 고정한 초안. 각 케이스는 docs/SPEC.md v0.2의 AC 번호와 대응한다.
# 판정 규칙: expected에 명시된 키가 응답에 존재하고 조건을 만족하면 통과. 명시 안 된 키는 판정에 안 씀.
# actor: 요청자. 생략하면 그 프로젝트 멤버로 로그인한 사용자. AC12·AC13 케이스는 actor를 명시한다.
# ng-* 케이스는 SPEC.md 6.1절 금지 기준(N번호)에 대응한다.

cases:
  - id: qi-001
    ac: AC1
    description: 재현 정보(screen_location) 없이 이슈를 등록하면 400과 빠진 항목 이름을 반환한다
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body: { description: "아이콘이 너무 커요", repro_steps: ["홈 진입", "아이콘 확인"], platform_scope: "common" }
      # screen_location 누락
    expected:
      status: 400
      body: { success: false }
      body_has: [error.code, error.message]
      error_message_contains: "screen_location"

  - id: qi-002
    ac: AC1
    description: 필수 정보(description/screen_location/repro_steps/platform_scope)가 모두 있으면 등록되고 status는 needs_check
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body:
        description: "아이콘이 너무 커요"
        screen_location: "홈 화면 상단 알림 아이콘"
        repro_steps: ["홈 진입", "상단 알림 아이콘 확인"]
        platform_scope: "aos"
    expected:
      status: 201
      body_has: [id, status, reported_by, created_at]
      body: { data: { status: "needs_check" } }

  - id: sm-001
    ac: AC2
    description: StyleMismatch는 expected_value와 actual_value가 둘 다 있어야 저장된다 — 하나만 있으면 거부
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body:
        description: "버튼 색이 달라요"
        screen_location: "로그인 화면 버튼"
        repro_steps: ["로그인 화면 진입"]
        platform_scope: "common"
        style_mismatch: { property: "color", expected_value: "Gray 80" }
        # actual_value 누락
    expected:
      status: 400
      body: { success: false }
      body_has: [error.code, error.message]

  - id: nt-001
    ac: AC3
    description: 담당자를 지정해 이슈를 등록하면 담당자에게 Notification(issue_created)이 정확히 1건 생성된다
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body:
        description: "아이콘이 너무 커요"
        screen_location: "홈 화면"
        repro_steps: ["홈 진입"]
        platform_scope: "common"
        assigned_to: "member-2"
    expected:
      status: 201
      followup:
        description: assigned_to(member-2)에게 생성된 Notification 수를 센다
        expected_notification_count_for_assignee: 1
        expected_notification_event: "issue_created"

  - id: nt-002
    ac: AC4
    description: 이슈 상태를 fixed로 바꾸면 등록자에게 Notification(fixed)이 정확히 1건 생성된다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      actor: 이슈의 assigned_to  # AC13
      body: { status: "fixed" }
    expected:
      status: 200
      body: { data: { status: "fixed" } }
      followup:
        description: reported_by에게 생성된 Notification 수를 센다
        expected_notification_count_for_reporter: 1
        expected_notification_event: "fixed"

  - id: vf-001
    ac: AC5
    description: fixed 상태 이슈를 조회하면 최초 등록된 repro_steps·screen_location·environment가 그대로 반환된다
    input:
      endpoint: GET /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 status가 fixed
    expected:
      status: 200
      body_has: [data.repro_steps, data.screen_location, data.environment]
      repro_steps_match_original: true

  - id: st-001
    ac: AC6
    description: needs_check 상태에서 재검증(verifications)을 바로 등록하려 하면 거부된다 (fixed만 재검증 가능)
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      actor: 이슈의 reported_by  # AC13
      precondition: 이슈 status가 needs_check
      body: { result: "pass" }
    expected:
      status: 409
      body: { success: false }

  - id: st-002
    ac: AC6
    description: 허용된 상태 전이(needs_check → fixed)는 성공하고 status_history에 남는다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      actor: 이슈의 assigned_to  # AC13
      precondition: 이슈 status가 needs_check
      body: { status: "fixed" }
    expected:
      status: 200
      body_has: [data.status_history]
      status_history_last_entry_has: [status, changed_by, changed_at]

  - id: vf-002
    ac: AC7
    description: 재검증 result가 pass면 이슈 상태가 resolved로 바뀌고 Verification 기록이 남는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      actor: 이슈의 reported_by  # AC13
      precondition: 이슈 status가 fixed
      body: { result: "pass" }
    expected:
      status: 201
      body: { data: { issue_status: "resolved" } }
      body_has: [data.verification.verified_by, data.verification.verified_at, data.repro_steps]

  - id: vf-003
    ac: AC7
    description: 재검증 result가 fail이면 이슈 상태가 needs_recheck로 바뀐다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      actor: 이슈의 reported_by  # AC13
      precondition: 이슈 status가 fixed
      body: { result: "fail" }
    expected:
      status: 201
      body: { data: { issue_status: "needs_recheck" } }

  - id: pc-001
    ac: AC8
    description: 자유서술 텍스트에 repro_steps에 해당하는 내용이 없으면 지어내지 않고 missing에 담아 되묻는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/parse
      body: { text: "아이콘이 너무 커요" }
      # 재현 절차 언급 없음
    expected:
      status: 200
      body_has: [data.context, data.missing]
      body: { data: { context: { screen: null } } }
      missing_contains: ["repro_steps"]

  - id: nt-003
    ac: AC3
    description: 담당자가 없던 이슈에 PATCH로 assigned_to를 새로 지정하면 그 담당자에게 Notification(issue_created)이 정확히 1건 생성된다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈에 assigned_to가 없음(null)
      body: { assigned_to: "member-3" }
    expected:
      status: 200
      body: { data: { assigned_to: "member-3" } }
      followup:
        description: assigned_to(member-3)에게 생성된 Notification 수를 센다
        expected_notification_count_for_assignee: 1
        expected_notification_event: "issue_created"

  - id: nt-004
    ac: AC3
    description: 담당자를 지정하지 않고 이슈를 등록하면 Notification이 생성되지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body:
        description: "텍스트가 잘려요"
        screen_location: "결제 화면 총액"
        repro_steps: ["결제 화면 진입"]
        platform_scope: "ios"
        # assigned_to 없음
    expected:
      status: 201
      followup:
        description: 이 이슈에 대해 생성된 Notification 총 개수를 센다
        expected_notification_count_total: 0

  - id: st-003
    ac: AC6
    description: needs_check 상태에서 PATCH로 status를 resolved로 직접 바꾸려 하면 거부된다(resolved는 재검증 등록으로만 전이 가능)
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 status가 needs_check
      body: { status: "resolved" }
    expected:
      status: 409
      body: { success: false }

  - id: health-001
    ac: AC9
    description: 헬스체크는 항상 200 (구현됨 — backend/src/main/java/com/acjb/server/controller/HealthController.java)
    input:
      endpoint: GET /api/v1/health
    expected:
      status: 200
      body: { status: "ok" }

  - id: auth-001
    ac: AC10
    description: 미인증 상태에서도 /auth/me는 200으로 응답한다 (구현됨 — AuthController.java)
    input:
      endpoint: GET /api/v1/auth/me
      authenticated: false
    expected:
      status: 200
      body: { authenticated: false }

  # --- AC11: 재검증 fail 알림 ---
  - id: nt-005
    ac: AC11
    description: 재검증이 fail로 등록되면 담당자에게 Notification(recheck_failed)이 정확히 1건 생성된다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      precondition: 이슈 status가 fixed, assigned_to가 member-2, reported_by가 member-1
      actor: member-1
      body: { result: "fail" }
    expected:
      status: 201
      body: { data: { issue_status: "needs_recheck" } }
      followup:
        description: assigned_to(member-2)에게 생성된 recheck_failed Notification 수를 센다
        expected_notification_count_for_assignee: 1
        expected_notification_event: "recheck_failed"

  - id: nt-006
    ac: AC11
    description: 재검증이 pass면 recheck_failed 알림은 생성되지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      precondition: 이슈 status가 fixed, assigned_to가 member-2, reported_by가 member-1
      actor: member-1
      body: { result: "pass" }
    expected:
      status: 201
      followup:
        description: 이 요청으로 생성된 recheck_failed Notification 수를 센다
        expected_notification_count_by_event: { recheck_failed: 0 }

  # --- AC12: 프로젝트 접근 ---
  - id: au-001
    ac: AC12
    description: 미인증으로 프로젝트 하위 경로를 호출하면 401
    input:
      endpoint: GET /projects/{projectId}/qa-issues
      authenticated: false
    expected:
      status: 401
      body: { success: false }

  - id: au-002
    ac: AC12
    description: 로그인했지만 그 프로젝트 멤버가 아니면 403이고 이슈 데이터를 담지 않는다
    input:
      endpoint: GET /projects/{projectId}/qa-issues
      actor: member-9 (다른 프로젝트 멤버)
    expected:
      status: 403
      body: { success: false }
      body_not_has: [data]

  # --- AC13: 역할별 권한 ---
  - id: au-003
    ac: AC13
    description: 담당자가 아닌 멤버가 fixed로 바꾸려 하면 403이고 상태·이력·알림이 바뀌지 않는다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 status가 needs_check, assigned_to가 member-2
      actor: member-3
      body: { status: "fixed" }
    expected:
      status: 403
      body: { success: false }
      followup:
        description: 이슈를 다시 조회하고 Notification 수를 센다
        expected_issue_status: "needs_check"
        status_history_length_unchanged: true
        expected_notification_count_total_delta: 0

  - id: au-004
    ac: AC13
    description: 담당자가 없는 이슈는 누구도 fixed로 바꿀 수 없다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 status가 needs_check, assigned_to가 null
      actor: member-1
      body: { status: "fixed" }
    expected:
      status: 403
      body: { success: false }

  - id: au-005
    ac: AC13
    description: 등록자가 아닌 멤버가 재검증을 등록하면 403이고 Verification이 생기지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      precondition: 이슈 status가 fixed, reported_by가 member-1
      actor: member-2
      body: { result: "pass" }
    expected:
      status: 403
      body: { success: false }
      followup:
        description: 이슈 상태와 Verification 수를 확인한다
        expected_issue_status: "fixed"
        expected_verification_count_delta: 0

  - id: au-006
    ac: AC13
    description: 권한 검사가 전이 검사보다 먼저다 — 권한 없는 사람이 허용되지 않은 전이를 요청하면 409가 아니라 403
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 status가 needs_check, assigned_to가 member-2
      actor: member-3
      body: { status: "resolved" }
    expected:
      status: 403

  - id: au-007
    ac: AC13
    description: 프로젝트 멤버가 아닌 사람을 담당자로 지정하면 400이고 알림이 생기지 않는다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      body: { assigned_to: "member-9" }
      # member-9는 이 프로젝트 멤버가 아님
    expected:
      status: 400
      body: { success: false }
      followup:
        expected_notification_count_total_delta: 0

  # --- SPEC 6.1 금지 기준 ---
  - id: ng-001
    ac: AC1
    rule: N1
    description: 공백만 있는 description은 빈 값으로 보고 거부하며 이슈를 저장하지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body: { description: "   ", screen_location: "홈 화면", repro_steps: ["홈 진입"], platform_scope: "common" }
    expected:
      status: 400
      error_message_contains: "description"
      followup:
        expected_issue_count_delta: 0

  - id: ng-002
    ac: AC2
    rule: N2
    description: style_mismatch가 잘못된 요청은 이슈도 저장하지 않는다(부분 저장 금지)
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      body:
        description: "버튼 색이 달라요"
        screen_location: "로그인 화면 버튼"
        repro_steps: ["로그인 화면 진입"]
        platform_scope: "common"
        assigned_to: "member-2"
        style_mismatch: { property: "color", actual_value: "#333333" }
        # expected_value 누락
    expected:
      status: 400
      followup:
        expected_issue_count_delta: 0
        expected_style_mismatch_count_delta: 0
        expected_notification_count_total_delta: 0

  - id: ng-003
    ac: AC2
    rule: N4
    description: scan은 v1에 포함돼(2026-10-28 확정, 설만수 승인) 유효한 요청(frame_id·node_id·target_url·selector)이면 비동기 작업이 큐에 들어가 202와 scan_id를 반환한다. node_id·selector는 openapi 단일 컴포넌트 scan 요청 형식에 맞춰 2026-11-05 추가(설만수 승인, 기대값은 그대로)
    input:
      endpoint: POST /projects/{projectId}/style-mismatches/scan
      body: { frame_id: "84:759", node_id: "84:759", target_url: "http://localhost:5173", selector: "button.primary" }
    expected:
      status: 202
      body_has: [scan_id, status]
      body: { data: { status: "queued" } }

  - id: ng-004
    ac: AC3
    rule: N5
    description: 이미 같은 담당자인데 다시 지정하면 알림을 만들지 않는다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 assigned_to가 member-2
      body: { assigned_to: "member-2" }
    expected:
      status: 200
      followup:
        expected_notification_count_total_delta: 0

  - id: ng-005
    ac: AC5
    rule: N6
    description: PATCH로 repro_steps를 바꾸려 하면 400이고 원본이 그대로다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      body: { repro_steps: ["다른 절차"] }
    expected:
      status: 400
      followup:
        repro_steps_match_original: true

  - id: ng-006
    ac: AC5
    rule: N6
    description: 재검증 요청에 repro_steps가 들어와도 원본을 덮어쓰지 않고 원본을 반환한다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      precondition: 이슈 status가 fixed
      actor: 이슈의 reported_by
      body: { result: "pass", repro_steps: ["바꾼 절차"] }
    expected:
      repro_steps_match_original: true

  - id: ng-007
    ac: AC6
    rule: N7
    description: 같은 상태로의 전이(fixed → fixed)는 409이고 status_history가 늘지 않는다
    input:
      endpoint: PATCH /projects/{projectId}/qa-issues/{issueId}
      precondition: 이슈 status가 fixed
      actor: 이슈의 assigned_to
      body: { status: "fixed" }
    expected:
      status: 409
      followup:
        status_history_length_unchanged: true
        expected_notification_count_total_delta: 0

  - id: ng-008
    ac: AC6
    rule: N8
    description: body에 reported_by를 넣어도 무시하고 로그인 사용자로 기록한다
    input:
      endpoint: POST /projects/{projectId}/qa-issues
      actor: member-1
      body:
        description: "아이콘이 너무 커요"
        screen_location: "홈 화면 상단 알림 아이콘"
        repro_steps: ["홈 진입"]
        platform_scope: "aos"
        reported_by: "member-5"
    expected:
      body: { data: { reported_by: "member-1" } }

  - id: ng-009
    ac: AC8
    rule: N9
    description: 파싱 API는 이슈를 만들지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/parse
      body: { text: "로그인 화면에서 버튼 누르면 앱이 꺼져요. 안드로이드만 그래요" }
    expected:
      status: 200
      followup:
        expected_issue_count_delta: 0

  - id: ng-010
    ac: AC12
    rule: N10
    description: 내 프로젝트 경로에 다른 프로젝트의 issueId를 넣어도 그 이슈 데이터를 반환하지 않는다
    input:
      endpoint: GET /projects/{projectId}/qa-issues/{issueId}
      precondition: issueId는 다른 프로젝트 소속, actor는 projectId의 멤버
    expected:
      status_in: [403, 404]
      body_not_has: [data]

  # ===== AC13(11-05 수정)·AC14~AC19·N14·N15 — 2026-11-05 설만수 승인 =====
  # 근거: docs/SPEC.md AC13(11-05 수정)·AC14~AC19, 6.1절 N14·N15. N16은 2차 LLM·RAG 설계 확정 후 작성.

  # --- AC14: 내 알림 조회 ---
  - id: nt-007
    ac: AC14
    description: 알림 목록은 요청자가 받은 것만 created_at desc, id desc 순으로 반환하고 다른 멤버의 알림은 담지 않는다
    input:
      endpoint: GET /projects/{projectId}/notifications
      precondition: member-1에게 알림 2건(먼저 A, 나중 B), member-2에게 알림 1건
      actor: member-1
    expected:
      status: 200
      items_count: 2
      items_order: [B, A]
      items_all: { to_member_id: "member-1" }

  # --- AC15: 프로젝트·멤버 조회 ---
  - id: pj-001
    ac: AC15
    description: 프로젝트 목록은 요청자가 멤버인 프로젝트만 name asc, id asc 순으로 반환한다
    input:
      endpoint: GET /projects
      precondition: actor는 "나" 프로젝트와 "가" 프로젝트의 멤버, "다" 프로젝트의 멤버가 아님
      actor: member-1
    expected:
      status: 200
      items_names_in_order: ["가", "나"]

  - id: pj-002
    ac: AC15
    description: 멤버 목록은 그 프로젝트 멤버에게만 반환하고 각 멤버의 프로젝트별 role을 담는다
    input:
      endpoint: GET /projects/{projectId}/members
      precondition: member-1(developer), member-2(designer)가 멤버
      actor: member-1
    expected:
      status: 200
      items_count: 2
      body_has: [data.items.id, data.items.name, data.items.email, data.items.role]

  # --- AC16: 프로젝트 생성 ---
  - id: pj-003
    ac: AC16
    description: 프로젝트를 만들면 요청자가 소유자이자 고른 role의 멤버가 된다
    input:
      endpoint: POST /projects
      actor: member-1
      body: { name: "새 프로젝트", role: "planner" }
    expected:
      status: 201
      body: { data: { name: "새 프로젝트", owner_id: "member-1" } }
      followup:
        description: GET /projects/{newId}/members
        expected_members: [{ id: "member-1", role: "planner" }]

  - id: pj-004
    ac: AC16
    description: role이 정해진 값이 아니거나 name이 비면 400이고 프로젝트를 만들지 않는다
    input:
      endpoint: POST /projects
      actor: member-1
      body: { name: "새 프로젝트", role: "manager" }
    expected:
      status: 400
      body: { success: false }
      followup:
        expected_project_count_delta: 0

  # --- AC17: 초대 ---
  - id: iv-001
    ac: AC17
    description: 멤버가 이메일로 초대하면 7일 뒤 만료되는 pending 초대 1건이 생기고 초대 메일이 1통 나간다
    input:
      endpoint: POST /projects/{projectId}/invitations
      actor: member-1
      body: { email: "new@test.dev" }
    expected:
      status: 201
      body: { data: { email: "new@test.dev", status: "pending", invited_by: "member-1" } }
      expires_at_minus_created_at: 7d
      expected_mail_count_delta: 1

  - id: iv-002
    ac: AC17
    description: 이미 그 프로젝트 멤버인 이메일을 초대하면 409이고 초대를 만들지 않는다
    input:
      endpoint: POST /projects/{projectId}/invitations
      precondition: member-2는 이미 멤버
      actor: member-1
      body: { email: "<member-2의 이메일>" }
    expected:
      status: 409
      error_code: ALREADY_MEMBER
      followup:
        expected_invitation_count_delta: 0

  - id: iv-003
    ac: AC17
    description: 같은 이메일에 pending 초대가 있으면 그 초대는 canceled가 되고 새 pending 초대가 생긴다(재발송)
    input:
      endpoint: POST /projects/{projectId}/invitations
      precondition: new@test.dev에게 pending 초대(old) 1건
      actor: member-1
      body: { email: "new@test.dev" }
    expected:
      status: 201
      followup:
        expected_invitation_status: { old: "canceled" }
        expected_pending_count_for_email: 1

  # --- AC18: 초대 수락 ---
  - id: iv-004
    ac: AC18
    description: 수락한 사람이 초대받은 이메일과 다른 계정이면 403이고 멤버를 만들지 않는다
    input:
      endpoint: POST /invitations/{token}/accept
      precondition: new@test.dev에게 온 pending 초대
      actor: other@test.dev로 로그인한 사용자
      body: { role: "designer" }
    expected:
      status: 403
      followup:
        expected_member_count_delta: 0
        expected_invitation_status: "pending"

  - id: iv-005
    ac: AC18
    description: 만료·취소·이미 수락된 초대를 수락하면 409이고 멤버를 만들지 않는다
    input:
      endpoint: POST /invitations/{token}/accept
      precondition: 초대 status가 accepted (expired·canceled도 같은 결과)
      actor: 초대받은 이메일로 로그인한 사용자
      body: { role: "designer" }
    expected:
      status: 409
      error_code: INVITATION_CLOSED
      followup:
        expected_member_count_delta: 0

  - id: iv-006
    ac: AC18
    description: role이 정해진 값이 아니면 400이고 멤버를 만들지 않으며 초대는 pending으로 남는다
    input:
      endpoint: POST /invitations/{token}/accept
      actor: 초대받은 이메일로 로그인한 사용자
      body: { role: "owner" }
    expected:
      status: 400
      followup:
        expected_member_count_delta: 0
        expected_invitation_status: "pending"

  - id: iv-007
    ac: AC18
    description: 초대받은 계정이 정해진 role로 수락하면 그 role의 멤버가 되고 초대는 accepted가 된다
    input:
      endpoint: POST /invitations/{token}/accept
      actor: 초대받은 이메일로 로그인한 사용자
      body: { role: "designer" }
    expected:
      status: 200
      body: { data: { id: "{projectId}" } }
      followup:
        expected_members_contains: { role: "designer" }
        expected_invitation_status: "accepted"

  # --- AC19: 멤버 제거 ---
  - id: pj-005
    ac: AC19
    description: 소유자가 멤버를 제거하면 그 멤버가 담당자인 미해결 이슈의 assigned_to만 비우고 resolved 이슈·상태·이력·알림은 그대로다
    input:
      endpoint: DELETE /projects/{projectId}/members/{memberId}
      precondition: member-2가 담당자인 이슈 X(needs_check)와 Y(resolved)
      actor: 소유자(member-1)
    expected:
      status: 204
      followup:
        expected_assigned_to: { X: null, Y: "member-2" }
        expected_issue_status: { X: "needs_check", Y: "resolved" }
        status_history_length_unchanged: true
        expected_notification_count_total_delta: 0

  - id: pj-006
    ac: AC19
    description: 소유자가 아닌 멤버가 다른 멤버를 제거하면 403이고 아무것도 바뀌지 않는다
    input:
      endpoint: DELETE /projects/{projectId}/members/{memberId}
      actor: member-2 (소유자 아님)
      target: member-3
    expected:
      status: 403
      followup:
        expected_member_count_delta: 0

  # --- AC13 (2026-11-05 수정): 등록자가 제거된 이슈의 재검증 ---
  - id: au-008
    ac: AC13
    description: 등록자가 프로젝트에서 제거됐으면 소유자가 재검증을 등록할 수 있다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      precondition: 이슈 status fixed, reported_by가 member-3이고 member-3은 제거됨
      actor: 소유자(member-1)
      body: { result: "pass" }
    expected:
      status: 201
      body: { data: { issue_status: "resolved" } }

  - id: au-009
    ac: AC13
    description: 등록자가 아직 멤버면 소유자라도 재검증을 등록할 수 없다(403, 상태·이력 그대로)
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/verifications
      precondition: 이슈 status fixed, reported_by가 member-3(멤버)
      actor: 소유자(member-1)
      body: { result: "pass" }
    expected:
      status: 403
      followup:
        expected_issue_status: "fixed"
        status_history_length_unchanged: true

  # --- 6.1절 금지 기준 ---
  - id: ng-011
    ac: AC17
    rule: N14
    description: 초대 응답·목록 어디에도 초대 토큰(원문·해시)을 담지 않는다
    input:
      endpoint: GET /projects/{projectId}/invitations, GET /invitations/mine, POST /projects/{projectId}/invitations 응답
    expected:
      body_not_has: [data.token, data.token_hash, data.items.token, data.items.token_hash]

  - id: ng-012
    ac: AC19
    rule: N15
    description: 소유자 자신은 제거할 수 없다(409) — 소유자 없는 프로젝트를 만들지 않는다
    input:
      endpoint: DELETE /projects/{projectId}/members/{ownerId}
      actor: 소유자
    expected:
      status: 409
      error_code: OWNER_NOT_REMOVABLE
      followup:
        expected_member_count_delta: 0

  - id: ng-013
    ac: AC19
    rule: N15
    description: 멤버를 제거해도 그 멤버가 등록한 이슈·status_history·알림·재검증 기록은 지우지 않는다
    input:
      endpoint: DELETE /projects/{projectId}/members/{memberId}
      precondition: member-2가 등록한 이슈 1건(재검증 1건, 알림 2건 포함)
      actor: 소유자
    expected:
      status: 204
      followup:
        expected_issue_count_delta: 0
        expected_verification_count_delta: 0
        expected_notification_count_total_delta: 0
        status_history_length_unchanged: true

  # ===== AC20·N16 재검증 범위 제안 — 2026-11-06 설만수 승인 =====
  # 근거: docs/SPEC.md AC20, 6.1절 N16, docs/design-recheck-suggestions.md 10절.
  # 임베딩(Voyage)·LLM(Claude)은 테스트 대역으로 바꾼다 — 서버가 규칙을 지키는지만 본다. 제안 품질은 evals/에서 잰다.
  # embedding_calls·llm_calls: 요청 한 번 동안 대역이 불린 횟수.

  # --- AC20: 재검증 범위 제안 ---
  - id: rs-001
    ac: AC20
    description: fixed 이슈의 등록자가 요청하면 검색된 문서를 근거로 단 제안을 그대로 돌려준다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: 이슈 X(fixed, 등록자 member-1, 화면 "결제 화면"), 같은 프로젝트에 이슈 7(화면 "결제 완료 화면")이 있고 검색 결과에 들어감
      llm_stub: { suggestions: [{ screen: "결제 완료 화면", reason: "같은 결제 버튼을 쓴다", evidence_ids: ["qa_issue:7"] }] }
      actor: member-1
    expected:
      status: 200
      body: { success: true, data: { issue_id: "{issueId}", dropped_count: 0 } }
      suggestions_count: 1
      suggestions_0: { screen: "결제 완료 화면", evidence: [{ type: "qa_issue", id: "7" }] }
      llm_calls: 1

  - id: rs-002
    ac: AC20
    description: fixed가 아닌 이슈에 요청하면 409이고 임베딩·LLM을 부르지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: 이슈 status needs_check, 등록자 member-1
      actor: member-1
    expected:
      status: 409
      error_code: INVALID_TRANSITION
      embedding_calls: 0
      llm_calls: 0

  - id: rs-003
    ac: AC20
    description: 재검증 등록 권한이 없는 멤버(등록자가 아닌 담당자)가 요청하면 403이고 임베딩·LLM을 부르지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: 이슈 status fixed, 등록자 member-1(멤버), 담당자 member-2
      actor: member-2
    expected:
      status: 403
      embedding_calls: 0
      llm_calls: 0

  - id: rs-004
    ac: AC20
    description: 검색할 다른 문서가 하나도 없으면 LLM을 부르지 않고 빈 제안을 돌려준다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: 프로젝트에 대상 이슈(fixed) 하나뿐, 스타일 차이·fail 재검증 기록 없음
      actor: 등록자
    expected:
      status: 200
      body: { data: { suggestions: [], searched_count: 0, dropped_count: 0 } }
      llm_calls: 0

  # --- 6.1절 금지 기준 N16 ---
  - id: ng-014
    ac: AC20
    rule: N16
    description: 검색 결과에 없던 id를 근거로 단 제안은 통째로 버리고 dropped_count에 센다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: 이슈 X(fixed), 검색 결과는 qa_issue:7과 qa_issue:9
      llm_stub:
        suggestions:
          - { screen: "결제 완료 화면", reason: "근거 있음", evidence_ids: ["qa_issue:7"] }
          - { screen: "장바구니 화면", reason: "근거 일부 지어냄", evidence_ids: ["qa_issue:9", "qa_issue:99"] }
      actor: 등록자
    expected:
      status: 200
      suggestions_count: 1
      suggestions_0: { screen: "결제 완료 화면" }
      body: { data: { dropped_count: 1 } }
      body_not_contains: ["99", "장바구니 화면"]

  - id: ng-015
    ac: AC20
    rule: N16
    description: 다른 프로젝트의 문서는 내용이 아무리 비슷해도 검색·근거에 들어가지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: 이슈 X(fixed, "결제 버튼 색이 달라요"), 다른 프로젝트에 같은 문장의 이슈 O, 이 프로젝트에는 주제가 다른 이슈 A 하나
      actor: 등록자
    expected:
      status: 200
      body: { data: { searched_count: 1 } }
      llm_calls: 1
      llm_input_contains: ["qa_issue:{A의 id}"]
      llm_input_not_contains: ["qa_issue:{O의 id}"]

  - id: ng-016
    ac: AC20
    rule: N16
    description: 제안을 요청해도 이슈·StyleMismatch·Verification·알림을 만들거나 바꾸지 않는다
    input:
      endpoint: POST /projects/{projectId}/qa-issues/{issueId}/recheck-suggestions
      precondition: rs-001과 같은 상태
      actor: 등록자
    expected:
      status: 200
      followup:
        expected_issue_count_delta: 0
        expected_style_mismatch_count_delta: 0
        expected_verification_count_delta: 0
        expected_notification_count_total_delta: 0
        expected_issue_status: "fixed"
        status_history_length_unchanged: true
